version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      test-tools:
        patterns: ['vitest', '@vitest/*', '@playwright/*', 'playwright*']
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
