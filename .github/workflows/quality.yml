name: Quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: local-ci-test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PLATFORM_TEST_DATABASE_URL: postgresql://postgres:local-ci-test@127.0.0.1:5432/postgres
      CI: 'true'
      TZ: Asia/Shanghai
      NEXT_TELEMETRY_DISABLED: '1'
      # The first push has no previous commit and sends an all-zero SHA.
      ASSET_BASE_REF: >-
        ${{ github.event.pull_request.base.sha ||
            (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) ||
            'HEAD' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - run: pnpm install --frozen-lockfile
      - name: Prepare documentation environment
        run: |
          python -m venv .venv-docs
          .venv-docs/bin/python -m pip install -r tools/docs/requirements.txt -r docs/validation/requirements.txt
      - name: Validate PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint
      - name: AI Contract synchronization
        run: .venv-docs/bin/python tools/docs/build_contracts.py --check
      - name: Quality checks including packed asset consumers
        run: |
          export npm_config_store_dir="$(dirname "$(pnpm store path)")"
          pnpm check
      - name: Packed asset export regression
        run: node --test tools/engineering/assets/packed-asset-exports.test.mjs
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high
      - name: Documentation tool regression
        run: |
          .venv-docs/bin/python -m unittest discover -s tools/docs -p 'test_*.py'
          node tools/docs/test_search.cjs
      - name: Install browser dependencies
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Studio shared component Handbook
        run: pnpm handbook:check:tree
      - name: Browser and production service checks
        run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: verification-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 7
