    <h1>AttemptHistory · 轮次进度</h1>
    <a href="../../../../apps/studio/src/app/agent-attempt.tsx" data-studio-export="AttemptHistory"
      >查看 AttemptHistory 代码入口</a
    >
    <p>
      接收一个轮次的公开记录 attempt、禁用状态 disabled 和可选的继续处理回调
      resume。会话页和表单侧栏共用。
    </p>
    <p>
      处理中展示原消息和进度。结束后将事件按阶段折叠显示，有执行时长的轮次会在摘要中标出时长。
      中断轮次会保留已保存内容和已有的追踪 ID，服务允许时可继续处理。用 Tab 移动焦点，Enter 或空格展开详情或激活按钮。
    </p>
    <a href="http://127.0.0.1:3200/?page=agent">在 Agent 工作区打开历史会话</a>
