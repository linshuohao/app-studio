<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>差旅申请 · 配置工作台布局预览</title>
    <link rel="stylesheet" href="../apps/studio/src/app/studio-ui.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      html {
        font-size: 13px;
      }
      body {
        margin: 0;
        display: flex;
        height: 100dvh;
        color: var(--studio-text);
        font: var(--studio-type-body);
        background: var(--studio-surface);
      }
      aside {
        width: 56px;
        flex: none;
        border-right: 1px solid var(--studio-border);
        display: flex;
        align-items: center;
        flex-direction: column;
        gap: 8px;
      }
      aside span {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        color: var(--studio-text-muted);
      }
      aside strong {
        display: grid;
        place-items: center;
        height: 48px;
      }
      aside [aria-current] {
        background: var(--studio-selected);
        border-radius: 8px;
        color: var(--studio-info-fg);
      }
      main {
        min-width: 0;
        flex: 1;
        display: flex;
        flex-direction: column;
        container-type: inline-size;
      }
      header,
      .heading,
      .actions,
      nav,
      .tabs,
      .switch {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      header,
      .heading,
      nav {
        padding-inline: 24px;
      }
      header {
        min-height: 48px;
        justify-content: space-between;
        border-bottom: 1px solid var(--studio-border);
        flex-wrap: wrap;
      }
      .switch {
        font: var(--studio-type-caption);
        color: var(--studio-text-muted);
      }
      select {
        font: inherit;
        padding: 4px;
        border: 1px solid var(--studio-border);
        border-radius: 4px;
        background: var(--studio-surface);
      }
      .heading {
        padding-block: 16px;
        flex-wrap: wrap;
      }
      h1 {
        font: var(--studio-type-title);
        margin: 0;
      }
      #state {
        font: var(--studio-type-caption);
        background: var(--studio-surface-muted);
        border-radius: 4px;
        padding: 2px 8px;
      }
      .actions {
        margin-left: auto;
        flex-wrap: wrap;
      }
      nav {
        justify-content: space-between;
        border-bottom: 1px solid var(--studio-border);
      }
      button {
        cursor: pointer;
      }
      .tab,
      #source {
        background: transparent;
        border: 0;
        color: var(--studio-text-muted);
        font: var(--studio-type-control);
        min-height: 40px;
        padding: 0 12px;
      }
      .tab[aria-pressed='true'],
      #source[aria-pressed='true'] {
        border-bottom: 2px solid var(--studio-primary);
        color: var(--studio-primary);
      }
      .content {
        background: var(--studio-bg);
        padding: 16px;
        flex: 1;
        min-height: 0;
        overflow: auto;
        container-type: inline-size;
      }
      .grid {
        min-height: 100%;
        display: grid;
        gap: 16px;
        grid-template-columns: 224px minmax(480px, 1fr) 288px;
      }
      .panel {
        padding: 16px;
        background: var(--studio-surface);
        border: 1px solid var(--studio-border);
        border-radius: 8px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      h2 {
        font: var(--studio-type-section);
        margin: 0;
      }
      .slot {
        flex: 1;
        display: grid;
        place-content: center;
        min-height: 180px;
        color: var(--studio-text-muted);
        background: var(--studio-bg);
        border: 1px dashed var(--studio-border);
        border-radius: 4px;
      }
      .tools {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      #panels {
        display: none;
      }
      textarea {
        width: 100%;
        min-height: 55vh;
        resize: vertical;
        padding: 16px;
        font: var(--studio-type-code);
        border: 1px solid var(--studio-border);
      }
      dialog {
        max-width: 400px;
        border: 1px solid var(--studio-border);
        border-radius: 8px;
        padding: 24px;
        color: inherit;
      }
      [hidden] {
        display: none !important;
      }
      @container (width < 1024px) {
        .grid {
          grid-template-columns: 224px minmax(0, 1fr);
        }
        #panels {
          display: flex;
          margin-bottom: 12px;
        }
        .grid .inspector,
        .grid[data-panel='inspector'] .panel {
          display: none;
        }
        .grid[data-panel='inspector'] {
          grid-template-columns: 1fr;
        }
        .grid[data-panel='inspector'] .inspector {
          display: flex;
        }
      }
      @container (width < 720px) {
        .grid {
          grid-template-columns: 1fr;
        }
        .grid .outline,
        .grid[data-panel='outline'] .panel {
          display: none;
        }
        .grid[data-panel='outline'] .outline {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <aside aria-label="Studio 主导航示意">
      <strong>S</strong
      ><span title="Agent" aria-label="Agent"
        ><svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.75"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="lucide lucide-bot"
          aria-hidden="true"
          focusable="false"
        >
          <path d="M12 8V4H8"></path>
          <rect width="16" height="12" x="4" y="8" rx="2"></rect>
          <path d="M2 14h2"></path>
          <path d="M20 14h2"></path>
          <path d="M15 13v2"></path>
          <path d="M9 13v2"></path></svg></span
      ><span title="表单" aria-label="表单" aria-current="page"
        ><svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.75"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="lucide lucide-file-text"
          aria-hidden="true"
          focusable="false"
        >
          <path
            d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"
          ></path>
          <path d="M14 2v5a1 1 0 0 0 1 1h5"></path>
          <path d="M10 9H8"></path>
          <path d="M16 13H8"></path>
          <path d="M16 17H8"></path></svg></span
      ><span title="物料" aria-label="物料"
        ><svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.75"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="lucide lucide-component"
          aria-hidden="true"
          focusable="false"
        >
          <path
            d="M15.536 11.293a1 1 0 0 0 0 1.414l2.376 2.377a1 1 0 0 0 1.414 0l2.377-2.377a1 1 0 0 0 0-1.414l-2.377-2.377a1 1 0 0 0-1.414 0z"
          ></path>
          <path
            d="M2.297 11.293a1 1 0 0 0 0 1.414l2.377 2.377a1 1 0 0 0 1.414 0l2.377-2.377a1 1 0 0 0 0-1.414L6.088 8.916a1 1 0 0 0-1.414 0z"
          ></path>
          <path
            d="M8.916 17.912a1 1 0 0 0 0 1.415l2.377 2.376a1 1 0 0 0 1.414 0l2.377-2.376a1 1 0 0 0 0-1.415l-2.377-2.376a1 1 0 0 0-1.414 0z"
          ></path>
          <path
            d="M8.916 4.674a1 1 0 0 0 0 1.414l2.377 2.376a1 1 0 0 0 1.414 0l2.377-2.376a1 1 0 0 0 0-1.414l-2.377-2.377a1 1 0 0 0-1.414 0z"
          ></path></svg></span
      ><span title="纯函数" aria-label="纯函数"
        ><svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.75"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="lucide lucide-square-function lucide-function-square"
          aria-hidden="true"
          focusable="false"
        >
          <rect width="18" height="18" x="3" y="3" rx="2" ry="2"></rect>
          <path d="M9 17c2 0 2.8-1 2.8-2.8V10c0-2 1-3.3 3.2-3"></path>
          <path d="M9 11.2h5.7"></path></svg
      ></span>
    </aside>
    <main>
      <header>
        <span>表单 / 差旅申请 / 配置</span
        ><label class="switch"
          >预览模式
          <select id="mode">
            <option value="edit">编辑配置</option>
            <option value="view">查看配置</option>
          </select></label
        >
      </header>
      <div class="heading">
        <a href="studio-form-detail-review.html">返回版本列表</a>
        <h1>11 月修订版</h1>
        <span id="state" role="status"></span>
        <div class="actions">
          <button id="more" data-demo>更多操作</button><button id="check" data-demo>检查配置</button
          ><button data-demo>预览配置</button
          ><button id="save" data-variant="primary">保存配置</button>
        </div>
      </div>
      <nav aria-label="配置分区">
        <div class="tabs"></div>
        <button id="source">JSON 原文</button>
      </nav>
      <div class="content">
        <div id="panels" class="tools">
          <button data-panel="outline">大纲</button><button data-panel="main">主内容</button
          ><button data-panel="inspector">检查器</button>
        </div>
        <div class="grid" data-panel="main">
          <section class="panel outline">
            <h2>大纲</h2>
            <div class="slot">当前分区的结构</div>
          </section>
          <section class="panel">
            <h2 id="sectionTitle"></h2>
            <div class="slot">主内容区</div>
          </section>
          <section class="panel inspector">
            <h2>检查器</h2>
            <div class="slot">选中项详情</div>
          </section>
        </div>
        <section id="json" class="panel" hidden>
          <h2><label for="raw">JSON 原文</label></h2>
          <textarea id="raw" spellcheck="false">
{
  "data": {
    "schema": {
      "type": "object"
    }
  }
}</textarea>
        </section>
      </div>
    </main>
    <dialog>
      <h2 id="dialogTitle"></h2>
      <p id="message"></p>
      <form method="dialog"><button class="studio-button">关闭</button></form>
    </dialog>
    <script>
      const find = (selector) => document.querySelector(selector);
      const mode = find('#mode'),
        source = find('#source'),
        raw = find('#raw'),
        grid = find('.grid');
      let section = '字段',
        showJson = false,
        saved = raw.value;
      for (const name of ['字段', '布局', '联动', '校验']) {
        const tab = document.createElement('button');
        tab.className = 'tab';
        tab.textContent = name;
        tab.onclick = () => {
          section = name;
          showJson = false;
          render();
        };
        find('.tabs').append(tab);
      }
      function render() {
        const viewing = mode.value === 'view';
        raw.readOnly = viewing;
        find('#save').hidden = find('#check').hidden = find('#more').hidden = viewing;

        find('#state').textContent = viewing
          ? '只读'
          : saved === raw.value
            ? '已保存'
            : '有未保存的更改';
        find('#sectionTitle').textContent = section;
        for (const tab of document.querySelectorAll('.tab'))
          tab.setAttribute('aria-pressed', !showJson && tab.textContent === section);
        source.textContent = showJson ? '返回' + section : 'JSON 原文';
        source.setAttribute('aria-pressed', showJson);
        grid.hidden = find('#panels').hidden = showJson;
        find('#json').hidden = !showJson;
      }
      for (const button of document.querySelectorAll('.actions button,#panels button')) {
        button.className = 'studio-button';
        button.dataset.variant ||= 'secondary';
      }
      source.onclick = () => {
        showJson = !showJson;
        render();
      };
      mode.onchange = raw.oninput = render;
      find('#save').onclick = () => {
        const unchanged = saved === raw.value;
        saved = raw.value;
        render();
        if (unchanged) find('#state').textContent = '当前配置已保存，无需重复保存';
      };
      for (const button of document.querySelectorAll('#panels button'))
        button.onclick = () => {
          grid.dataset.panel = button.dataset.panel;
        };
      for (const button of document.querySelectorAll('[data-demo]'))
        button.onclick = () => {
          find('#dialogTitle').textContent = button.textContent;
          find('#message').textContent =
            button.id === 'more'
              ? '此处收纳查看改动、Agent 协作等辅助操作。'
              : '此处为工作台操作入口的布局示意。';
          find('dialog').showModal();
        };
      render();
    </script>
  </body>
</html>
