          !(
            typeof value === type ||
            (type === 'integer' && Number.isInteger(value)) ||
            (type === 'integer | null' && Number.isInteger(value))
          )
        )
          throw Error('比较值和比较方式必须与字段类型相容。');
        expr = { op: d.op, args: [{ ref: d.ref }, value] };
      }
      if (!conditionSupported(expr) || !validateConstraint({ ...planRule, when: expr }))
        throw Error('请核对条件的字段和表达式。');
      const parts = conditionParts(rule().when);
      parts[d.i < 0 ? parts.length : d.i] = expr;
      setConditions(parts, rule().when?.op === 'core.or' ? 'core.or' : 'core.and');
      $('#conditionModal').close();
      save();
      render();
    }
    function requiringRules(id) {
      return items.filter(({ r }) =>
        r.requires?.some((x) => x.kind === 'constraint' && x.constraintId === id),
      );
    }
    function binderPath(r) {
      return r.scope?.mode === 'each' && r.scope.from?.source === 'data' && !r.scope.from.scope
        ? r.scope.from.path
        : undefined;
    }
    function sameLocation(a, x, b, y) {
      return (
        x &&
        y &&
        x.path === y.path &&
        ((!x.scope && !y.scope) ||
          (x.scope && y.scope && binderPath(a) && binderPath(a) === binderPath(b)))
      );
    }
    function prerequisites(r, entry) {
      return entry.kind === 'constraint'
        ? items.map((x) => x.r).filter((x) => x.id === entry.constraintId)
        : items
            .map((x) => x.r)
            .filter((x) => x.kind === 'internal' && sameLocation(r, entry.target, x, target(x)));
    }
    function reachesRule(candidate, id, seen = new Set()) {
      if (candidate.id === id) return true;
      if (seen.has(candidate.id)) return false;
      seen.add(candidate.id);
      return (candidate.requires || []).some((x) =>
        prerequisites(candidate, x).some((next) => reachesRule(next, id, seen)),
      );
    }
    function canRequire(entry) {
      const r = rule();
      const duplicate = (r.requires || []).some(
        (x, i) =>
          i !== requirementIndex &&
          x.kind === entry.kind &&
          (entry.kind === 'field'
            ? same(x.target, entry.target)
            : x.constraintId === entry.constraintId),
      );
      return !duplicate && !prerequisites(r, entry).some((x) => reachesRule(x, r.id));
    }
    function writeRequirement(entry) {
      if (!canRequire(entry)) return;
      const all = (rule().requires ??= []);
      all[requirementIndex < 0 ? all.length : requirementIndex] = entry;
      $('#picker').close();
      save();
      render();
    }
    function scopedLocations(expr, alias) {
      if (!expr || typeof expr !== 'object' || Object.hasOwn(expr, 'literal')) return false;
      return (
        expr.ref?.scope === alias ||
        expr.ref?.field?.scope === alias ||
        (Array.isArray(expr.args) && expr.args.some((x) => scopedLocations(x, alias)))
      );
    }
    function showScopePreview() {
      const r = rule(),
        each = $('#scopeChoice :checked').value === 'each';
      const bindings = refs(r).map((ref, i) => ({
        label:
          r.kind === 'external'
            ? 'Host 依赖 ' + (i + 1)
            : '函数入参 ' + (catalog[r.assert?.op]?.manifest.parameters[i]?.name || i + 1),
        ref,
      }));
      bindings.push({ label: '错误归属', ref: target(r) });
      const affected = bindings.filter((b) => b.ref?.scope && !each);
      const conditionUsesMember = !each && !!alias() && scopedLocations(r.when, alias());
      const scopedPrerequisite =
        !each && !!alias() && r.requires?.some((x) => x.target?.scope === alias());
      const rulePrerequisite =
        !each &&
        !!alias() &&
        r.requires?.some(
          (x) =>
            x.kind === 'constraint' && items.find((item) => item.r.id === x.constraintId)?.r.scope,
        );
      const downstream =
        each && !r.scope
          ? requiringRules(r.id).filter((x) => binderPath(x.r) !== binder.from.path)
          : [];
      const advancedLock = conditionUsesMember || scopedPrerequisite || rulePrerequisite;

      const uses = bindings
        .filter((b) => b.ref)
        .map(
          (b) =>
            '<div class="scopeRef"><small>' +
            esc(b.label) +
            '</small><br>' +
            esc(title(b.ref)) +
            ' <code>' +
            esc(b.ref.path) +
            '</code></div>',
        )
        .join('');
      $('#scopePreview').innerHTML =
        '<h3>可引用的位置</h3><p>表单根 <code>/</code></p>' +
        (each
          ? '<p>当前被保人 <code>' +
            esc(alias() || binder.as) +
            '</code> · 来自 <code>/insureds</code></p>'
          : '') +
        (uses ? '<h3 class="info">规则已有引用</h3>' + uses : '');
      $('#scopeNote').textContent = downstream.length
        ? '改为逐成员前，请先调整这些规则对本条的同步前置：' +
          downstream.map((x) => x.name).join('、') +
          '。'
        : advancedLock
          ? '切换前请在「适用条件与前置要求」中处理成员引用，或在本条 JSON 中调整规则前置的绑定。'
          : affected.length
            ? '切回整张表单前，请先更换这些成员引用：' +
              affected.map((b) => b.label + '「' + title(b.ref) + '」').join('、') +
              '。'
            : each && target(r) && !target(r).scope
              ? '当前错误归属指向表单根。应用后仍保留此引用。'
              : '';
      $('#scopeApply').disabled = affected.length > 0 || advancedLock || downstream.length > 0;
    }
    $('#scopeChoice').addEventListener('change', (e) => {
      if (e.target.name === 'scope') showScopePreview();
    });
    function openPick(role) {
      picking = role;
      const titles = {
        function: '选择判断函数',
        target: '选择错误归属字段',
        watch: '添加 Host 依赖字段',
        'cond-function': '选择返回布尔值的纯函数',
        'cond-field': '选择条件字段',
        'require-field': '选择需通过同步校验的字段',
        'require-constraint': '选择需通过的内部校验规则',
      };
      $('#pickTitle').textContent = titles[role] || '选择函数参数字段';
      $('#search').value = '';
      choices();
      $('#picker').showModal();
      $('#search').focus();
    }
    function choices() {
      const q = $('#search').value.trim().toLowerCase(),
        r = rule();
      if (picking === 'function' || picking === 'cond-function') {
        $('#choices').innerHTML =
          functions
            .filter(
              (f) =>
                f.manifest.returns.type === 'boolean' &&
                (names[f.manifest.id] + f.manifest.id).toLowerCase().includes(q),
            )
            .map(
              (f) =>
                '<button class="treebtn" data-fn="' +
                f.manifest.id +
                '"><span>' +
                names[f.manifest.id] +
                '<code>' +
                f.manifest.id +
                '</code></span>boolean</button>',
            )
            .join('') || '没有匹配的函数';
        return;
      }
      if (picking === 'require-constraint') {
        $('#choices').innerHTML =
          items
            .filter(
              ({ name, r: x }) =>
                x.kind === 'internal' &&
                x.id !== r.id &&
                (name + ' ' + x.id).toLowerCase().includes(q),
            )
            .map(({ name, r: x }) => {
              const compatible = !x.scope || (binderPath(x) && binderPath(x) === binderPath(r));
              const complete = validateConstraint(x);
              const enabled =
                compatible && complete && canRequire({ kind: 'constraint', constraintId: x.id });
              return (
                '<button class="treebtn" data-prerequisite="' +
                esc(x.id) +
                '" ' +
                (enabled ? '' : 'disabled') +
                '><span>' +
                esc(name) +
                '<code>' +
                esc(x.id) +
                '</code></span><small>' +
                (compatible
                  ? enabled
                    ? x.scope
                      ? '同一成员'
                      : '表单根'
                    : complete
                      ? '已添加或形成循环'
                      : '规则尚未配置完整'
                  : '无法绑定到当前范围') +
                '</small></button>'
              );
            })
            .join('') || '<p>没有可选的其他内部校验规则。</p>';
        return;
      }
      const condArg = picking.startsWith('cond-arg'),
        idx = condArg ? Number(picking.slice(8)) : Number(picking.slice(3));
      const param = condArg
        ? catalog[conditionDraft.fn].manifest.parameters[idx]
        : picking.startsWith('arg')
          ? catalog[r.assert.op].manifest.parameters[idx]
          : null;
      const sel =
        picking === 'target'
          ? target(r)
          : picking === 'cond-field'
            ? conditionDraft.ref
            : condArg
              ? conditionDraft.args[idx]?.ref
              : r.assert?.args[idx]?.ref;
      function branch(member) {
        const tab = member ? memberFields : rootFields;
        const heading = member ? '当前被保人' : '表单根';
        const keys = Object.keys(tab),
          match = (k) => (heading + tab[k][0] + k).toLowerCase().includes(q);
        return (
          '<h3>' +
          heading +
          '</h3>' +
          keys
            .filter((k) => match(k) || keys.some((sub) => sub.startsWith(k + '/') && match(sub)))
            .map((k) => {
              const [label, type] = tab[k],
                ok =
                  (!param || param.schema === true || type === 'policy') &&
                  (picking !== 'cond-field' ||
                    ['string', 'boolean', 'integer', 'number', 'integer | null'].includes(type)) &&
                  (picking !== 'require-field' ||
                    canRequire({
                      kind: 'field',
                      target: member ? { ...field(k), scope: alias() } : field(k),
                      phase: 'sync',
                    })) &&
                  (picking !== 'watch' ||
                    !r.watch.some((f) =>
                      same(f, member ? { ...field(k), scope: alias() } : field(k)),
                    )),
                ref = field(k);
              if (member) ref.scope = alias();
              return (
                '<button class="treebtn" style="padding-left:' +
                ((k.split('/').length - 2) * 16 + 9) +
                'px" data-path="' +
                k +
                '" data-member="' +
                member +
                '" aria-pressed="' +
                !!same(sel, ref) +
                '" ' +
                (!ok ? 'disabled' : '') +
                '><span>' +
                esc(label) +
                '<code>' +
                k +
                '</code></span><small>' +
                (ok
                  ? type === 'policy'
                    ? 'object'
                    : type
                  : picking === 'watch'
                    ? '已添加'
                    : picking === 'require-field'
                      ? '已添加或形成循环'
                      : picking === 'cond-field'
                        ? '请选择基本类型字段'
                        : '需要策略对象') +
                '</small></button>'
              );
            })
            .join('')
        );
      }
      $('#choices').innerHTML = (alias() ? branch(true) : '') + branch(false);
      if (!$('#choices button')) $('#choices').innerHTML = '<p>没有匹配的字段</p>';
    }
    document.addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      if (b.hasAttribute('data-close')) return b.closest('dialog').close();
      if (b.dataset.index !== undefined) {
        selected = Number(b.dataset.index);
        return render();
      }
      if (b.id === 'new' || b.id === 'settings') {
        manageNew = b.id === 'new';
        $('#manageError').textContent = '';
        $('#manageTitle').textContent = manageNew ? '新建校验规则' : '编辑规则';
        $('#newName').value = manageNew ? '' : items[selected].name;
        $('#newKind').value = manageNew ? 'internal' : rule().kind;
        $('#manage').showModal();
        $('#newName').focus();
        return;
      }
      if (b.id === 'manageApply') {
        const name = $('#newName').value.trim();
        if (!name) {
          $('#newName').focus();
          return;
        }
        const kind = $('#newKind').value,
          old = manageNew ? null : rule();
        if (old?.kind === 'internal' && kind === 'external' && requiringRules(old.id).length) {
          $('#manageError').textContent =
            '请先移除这些规则对本条的同步前置：' +
            requiringRules(old.id)
              .map((x) => x.name)
              .join('、');
          return;
        }
        if (manageNew || kind !== old.kind) {
          const base = { id: old?.id || 'constraint-' + crypto.randomUUID(), kind };
          for (const k of ['scope', 'when', 'requires'])
            if (old && Object.hasOwn(old, k)) base[k] = copy(old[k]);
          const t = old && target(old);
          if (kind === 'internal') {
            base.issue = { code: 'VALIDATION_FAILED', ...(t && { target: t }) };
          } else {
            base.validator = '';
            base.watch = [];
            if (t) base.target = t;
          }
          if (manageNew) {
            items.push({ name, r: base });
            selected = items.length - 1;
          } else items[selected] = { name, r: base };
        } else items[selected].name = name;
        $('#manage').close();
        save();
        render();
        return;
      }
      if (b.dataset.cond !== undefined) return openCondition(Number(b.dataset.cond));
      if (b.id === 'conditionCancel') return $('#conditionModal').close();
      if (b.id === 'conditionApply') {
        try {
          applyCondition();
        } catch (err) {
          $('#conditionError').textContent = err.message;
        }
        return;
      }
      if (b.dataset.removeCond !== undefined) {
        const parts = conditionParts(rule().when);
        parts.splice(Number(b.dataset.removeCond), 1);
        setConditions(parts, rule().when?.op || 'core.and');
        save();
        return render();
      }
      if (b.dataset.require !== undefined) {
        const [kind, i] = b.dataset.require.split(':');
        requirementIndex = Number(i);
        return openPick('require-' + kind);
      }
      if (b.dataset.prerequisite !== undefined)
        return writeRequirement({ kind: 'constraint', constraintId: b.dataset.prerequisite });
      if (b.dataset.removeRequire !== undefined) {
        rule().requires.splice(Number(b.dataset.removeRequire), 1);
        if (!rule().requires.length) delete rule().requires;
        save();
        return render();
      }
      if (b.id === 'delete') {
        const users = requiringRules(rule().id);
        $('#deleteApply').disabled = users.length > 0;
        $('#deleteName').textContent = users.length
          ? '请先移除这些规则对本条的同步前置：' + users.map((x) => x.name).join('、')
          : items[selected].name;
        $('#remove').showModal();
        return;
      }
      if (b.id === 'deleteApply') {
        if (b.disabled) return;
        items.splice(selected, 1);
        selected = Math.max(0, Math.min(selected, items.length - 1));
        $('#remove').close();
        save();
        render();
        return;
      }
      if (b.dataset.drop !== undefined) {
        rule().watch.splice(+b.dataset.drop, 1);
        save();
        return render();
      }

      if (b.id === 'fn') return openPick('function');
      if (b.dataset.pick) return openPick(b.dataset.pick);
      if (b.hasAttribute('data-fn') && picking === 'cond-function') {
        if (conditionDraft.fn !== b.dataset.fn) {
          conditionDraft.fn = b.dataset.fn;
          conditionDraft.args = catalog[b.dataset.fn].manifest.parameters.map(() => null);
        }
        $('#picker').close();
        drawCondition();
        return;
      }
      if (b.hasAttribute('data-fn')) {
        if (rule().assert?.op !== b.dataset.fn)
          rule().assert = {
            op: b.dataset.fn,
            args: catalog[b.dataset.fn].manifest.parameters.map(() => null),
          };
        $('#picker').close();
        save();
        return render();
      }
      if (b.dataset.path) {
        const ref = field(b.dataset.path);
        if (b.dataset.member === 'true') ref.scope = alias();
        if (picking === 'require-field')
          return writeRequirement({ kind: 'field', target: ref, phase: 'sync' });
        if (picking === 'cond-field' || picking.startsWith('cond-arg')) {
          if (picking === 'cond-field') conditionDraft.ref = ref;
          else conditionDraft.args[Number(picking.slice(8))] = { ref };
          $('#picker').close();
          drawCondition();
          return;
        }
        if (picking === 'watch') rule().watch.push(ref);
        else if (picking === 'target') {
          if (rule().kind === 'internal') rule().issue.target = ref;
          else rule().target = ref;
        } else rule().assert.args[Number(picking.slice(3))] = { ref };
        $('#picker').close();
        save();
        return render();
      }
      if (b.id === 'setScope') {
        const dialog = $('#scopeChoice');
        dialog.querySelector('[value="' + (alias() ? 'each' : 'root') + '"]').checked = true;
        $('#scopeRule').textContent = items[selected].name;
        showScopePreview();
        dialog.showModal();
      }
      if (b.id === 'scopeApply') {
        if (b.disabled) return;
        if ($('#scopeChoice :checked').value === 'each') rule().scope ??= copy(binder);
        else delete rule().scope;
        $('#scopeChoice').close();
        save();
        render();
      }

      if (b.id === 'jsonBtn' || b.id === 'allJson' || b.hasAttribute('data-rule-json')) {
        jsonAll = b.id === 'allJson';
        $('#jsonBox h2').textContent = jsonAll ? '整组 constraints JSON' : '本条规则 JSON';
        $('#raw').value = JSON.stringify(jsonAll ? items.map((x) => x.r) : rule(), null, 2);
        $('#jsonError').textContent = '';
        $('#jsonBox').showModal();
      }
      if (b.id === 'jsonApply') {
        try {
          const next = JSON.parse($('#raw').value);
          const all = jsonAll ? next : items.map((x, i) => (i === selected ? next : x.r));
          if (!Array.isArray(all) || !(jsonAll ? all : [next]).every(validateConstraint))
            throw Error('请检查范围、判断方式、输入与错误归属是否符合 Constraint 协议。');
          if (new Set(all.map((r) => r.id)).size !== all.length) throw Error('规则 id 必须唯一');
          if (jsonAll) {
            const labels = new Map(items.map((x) => [x.r.id, x.name]));
            items = all.map((r) => ({ r, name: labels.get(r.id) || r.id }));
            selected = Math.max(0, Math.min(selected, items.length - 1));
          } else items[selected].r = next;
          $('#jsonBox').close();
          save();
          render();
        } catch (err) {
          $('#jsonError').textContent = err.message;
        }
      }
    });
    $('#search').oninput = choices;
    $('#conditionKind').onchange = (e) => {
      conditionDraft.kind = e.target.value;
      drawCondition();
    };
    $('#conditionModal').addEventListener('input', (e) => {
      if (e.target.id === 'conditionValue') conditionDraft.raw = e.target.value;
      if (e.target.id === 'conditionOp') conditionDraft.op = e.target.value;
    });
    document.addEventListener('change', (e) => {
      if (e.target.id === 'conditionJoin') {
        setConditions(conditionParts(rule().when), e.target.value);
        save();
        render();
      }
    });

    document.addEventListener('input', (e) => {
      if (e.target.id === 'message' || e.target.id === 'code') {
        if (e.target.id === 'code') rule().issue.code = e.target.value;
        else if (e.target.value) rule().issue.message = { text: e.target.value };
        else delete rule().issue.message;
        save();
      }
    });
    document.addEventListener('change', (e) => {
      const a = e.target;
      if (a.id === 'validator') {
        rule().validator = a.value.trim();
        save();
        return;
      }
    });
    render();
  </script>
</html>
