<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>旅险投保 · 数据模型</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #f4f5f2;
      color: #222d2c;
      font:
        15px/1.55 system-ui,
        'PingFang SC',
        sans-serif;
    }
    header,
    main {
      max-width: 1120px;
      margin: auto;
    }
    header {
      padding: 36px 22px 22px;
    }
    small,
    code,
    .path {
      font:
        12px/1.6 ui-monospace,
        monospace;
      color: #576967;
      overflow-wrap: anywhere;
    }
    h1 {
      font-size: 32px;
      letter-spacing: -1px;
      margin: 4px 0;
    }
    h2 {
      margin: 4px 0 14px;
      font-size: 23px;
    }
    h3 {
      font-size: 15px;
      margin: 0 0 12px;
    }
    button,
    select,
    input,
    textarea {
      font: inherit;
      color: inherit;
    }
    button,
    select,
    input,
    textarea {
      border: 1px solid #cbd4d0;
      background: white;
      border-radius: 6px;
      padding: 6px 10px;
    }
    button {
      cursor: pointer;
    }
    button:hover {
      border-color: #417669;
    }
    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    select:focus-visible {
      outline: 3px solid #81af9d;
    }
    button:disabled {
      opacity: 0.45;
      cursor: default;
    }
    main {
      padding: 0 22px 32px;
    }
    .shell {
      display: grid;
      grid-template-columns: 255px minmax(0, 1fr);
      border: 1px solid #cbd3ce;
      border-radius: 12px;
      overflow: hidden;
      background: #fff;
      min-height: 580px;
    }
    aside {
      background: #f8faf7;
      border-right: 1px solid #dae1db;
      padding: 20px 12px;
    }
    aside h3 {
      margin: 0 8px 14px;
    }
    aside button {
      display: block;
      width: 100%;
      background: transparent;
      border-color: transparent;
      text-align: left;
      overflow-wrap: anywhere;
    }
    .active {
      background: #e1eee6 !important;
      color: #164f3e;
      border-color: #adcbba;
    }
    article {
      padding: 26px;
      min-width: 0;
    }
    .modes {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 24px;
    }
    .note {
      color: #56645e;
      font-size: 14px;
    }
    .card {
      border-top: 1px solid #dde3dc;
      padding: 18px 0;
    }
    .field {
      display: grid;
      grid-template-columns: minmax(80px, 130px) minmax(0, 1fr);
      align-items: center;
      gap: 12px;
      margin: 9px 0;
    }
    .field input {
      width: 100%;
    }
    .branch {
      margin: 9px 0 9px 4px;
      border-left: 2px solid #c4dacf;
      padding: 0 0 0 12px;
      min-width: 0;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      margin: 6px 0;
    }
    .row input {
      min-width: 0;
      max-width: 100%;
      flex: 1;
    }
    .key {
      font:
        13px ui-monospace,
        monospace;
      background: #f4f6f3;
    }
    textarea {
      width: 100%;
      height: 330px;
      resize: vertical;
      background: #192c2a;
      color: #dcefe2;
      font:
        14px/1.55 ui-monospace,
        monospace;
      padding: 12px;
    }
    footer {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      border-top: 1px solid #d8e0da;
      padding: 15px 0;
      margin-top: 18px;
    }
    .primary {
      background: #225b47;
      color: white;
      border-color: #225b47;
    }
    #status {
      font-size: 13px;
    }
    button.tiny {
      font-size: 12px;
      padding: 3px 8px;
    }
    .trail {
      color: #65726c;
    }
    .headrow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .choices {
      display: grid;
      gap: 8px;
    }
    .choices button {
      text-align: left;
    }
    @media (max-width: 700px) {
      .shell {
        grid-template-columns: 1fr;
      }
      aside {
        max-height: 190px;
        overflow: auto;
        border-bottom: 1px solid #dae1db;
      }
      header {
        padding-top: 18px;
      }
      article {
        padding: 16px;
      }
      .branch {
        padding-left: 5px;
        margin-left: 1px;
      }
      .field {
        grid-template-columns: 90px 1fr;
      }
      main {
        padding: 0 10px 12px;
      }
    }
    aside #addField {
      background: #235b48;
      color: white;
      margin: 8px 0 16px;
      text-align: center;
    }
    #tree {
      max-height: 600px;
      overflow: auto;
    }
    dialog {
      width: min(490px, 94vw);
      border: 1px solid #b9cabe;
      border-radius: 12px;
      padding: 24px;
      color: #23342d;
    }
    dialog::backdrop {
      background: #10271f62;
    }
    .danger,
    #err {
      color: #963c32;
    }
    details {
      border-top: 1px solid #dce4dc;
      padding: 13px 0;
    }
    summary {
      cursor: pointer;
      font-weight: 600;
    }
    .field select,
    .field input {
      min-width: 0;
    }
    .field:has(input[type='checkbox']) input {
      width: auto;
      justify-self: start;
    }
    .tag {
      float: right;
      color: #5a7168;
      font: 11px/1.8 monospace;
    }
    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 12px 0;
    }
    .toolbar button {
      font-size: 13px;
    }
    .rules {
      background: #f1f6f1;
      border-radius: 8px;
      padding: 12px;
      margin: 10px 0;
    }
    dialog input,
    dialog select {
      max-width: 100%;
    }
    #panel .note {
      margin: 8px 0;
    }
    .field span {
      overflow-wrap: anywhere;
    }
    @media (max-width: 700px) {
      #tree {
        max-height: none;
      }
      aside #addField {
        margin: 4px 0;
      }
    }
    .tree-tools {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    .tree-tools button {
      width: auto;
    }
    .flow {
      border: 1px solid #ccdacd;
      border-radius: 8px;
      padding: 10px 14px;
      margin: 10px 0;
      background: #f6faf5;
    }
    .flow > div {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: start;
      padding: 7px 0;
    }
    .flow > div + div {
      border-top: 1px solid #dce8db;
    }
    .flow strong {
      color: #305744;
      font-size: 13px;
    }
    .flow span {
      overflow-wrap: anywhere;
    }
    .typehint {
      border-left: 3px solid #81a992;
      padding: 5px 12px;
      color: #485d50;
    }
    .tree-ref {
      display: flex;
      align-items: center;
    }
    .tree-ref .expander {
      width: 26px;
      flex: none;
      padding: 4px;
      color: #295940;
    }
    .tree-ref button + button {
      min-width: 0;
    }
    .shared-context {
      border-left: 3px solid #82ad98;
      padding: 5px 12px;
      background: #f3f8f3;
      margin-bottom: 12px;
    }
    aside #arrayChild[hidden] {
      display: none;
    }
    .definitions {
      border-top: 1px solid #ccd7cf;
      padding-top: 15px;
      margin-top: 15px;
    }
    .definitions nav {
      max-height: 320px;
      overflow: auto;
    }
    .inline-edit {
      display: block !important;
      border: 1px solid #9cbba9;
      border-radius: 8px;
      padding: 14px !important;
      margin: 8px 0;
      background: #fff;
    }
    .inline-edit .rule-entry {
      padding: 8px 0;
      border-bottom: 1px solid #ddd;
    }
    .inline-edit .rule-json {
      height: 90px;
    }
    .flow header {
      margin: 0;
      padding: 0;
    }
    .flow .toolbar {
      margin: 0;
    }
    .flow .inline-edit summary {
      font-size: 14px;
    }
  </style>
  <header>
    <small>旅险投保 / 表单设计</small>
    <h1>数据模型</h1>
    <div class="headrow">
      <div class="note">旅险投保申请 · JSON Schema Draft 2020-12</div>
      <button id="coverage">覆盖标准</button>
    </div>
  </header>
  <main>
    <div class="shell">
      <aside>
        <div class="headrow">
          <h3>表单结构</h3>
          <small>2020-12</small>
        </div>
        <button class="primary" id="addField">＋ 新增字段</button>
        <div class="tree-tools">
          <button id="arrayChild" class="tiny">＋ 数组元素</button
          ><button id="remove" class="tiny danger">删除节点</button>
        </div>
        <nav id="tree" aria-label="表单结构"></nav>
        <section class="definitions">
          <div class="headrow">
            <h3>共享定义</h3>
            <button id="newDef" class="tiny" style="width: auto">＋ 新增定义</button>
          </div>
          <nav id="defTree" aria-label="共享定义"></nav>
        </section>
      </aside>
      <article>
        <div class="path" id="path"></div>
        <div class="headrow">
          <h2 id="title"></h2>
        </div>
        <div class="modes" id="modes"></div>
        <div id="panel"></div>
        <footer>
          <button id="apply" class="primary">应用到草稿</button><button id="undo">撤销</button
          ><span id="status" role="status"></span>
        </footer>
      </article>
    </div>
  </main>
  <dialog id="dialog">
    <form method="dialog" id="form">
      <h2 id="dialogTitle"></h2>
      <div id="body"></div>
      <p id="err" role="alert"></p>
      <footer>
        <button type="button" id="cancel">取消</button
        ><button class="primary" id="confirm">确认</button>
      </footer>
    </form>
  </dialog>
  <script>
    'use strict';
    const original = {
      $schema: 'https://json-schema.org/draft/2020-12/schema',
      title: '旅险表单',
      type: 'object',
      properties: {
        trip: { title: '行程类型', type: 'string', enum: ['境内', '境外'] },
        passportNo: { title: '护照号码', type: 'string', minLength: 6, maxLength: 12 },
        insured: {
          title: '被保险人',
          type: 'array',
          minItems: 1,
          maxItems: 5,
          items: {
            title: '每位被保险人',
            type: 'object',
            required: ['name'],
            properties: {
              name: { title: '姓名', type: 'string', minLength: 1 },
              age: { title: '年龄', type: 'integer', minimum: 0, maximum: 100 },
              premium: { title: '保费', type: 'number', minimum: 0, multipleOf: 0.01 },
              minor: { title: '是否未成年', type: 'boolean' },
              guardian: { title: '监护人姓名', type: ['string', 'null'] },
              address: {
                title: '通讯地址',
                type: 'object',
                properties: { city: { title: '城市', type: 'string' } },
              },
              remark: { title: '空值占位', type: 'null' },
            },
            if: { required: ['minor'], properties: { minor: { const: true } } },
            then: {
              required: ['guardian'],
              properties: { guardian: { type: 'string', minLength: 1 } },
            },
          },
        },
        contact: { title: '投保联系人', $ref: '#/$defs/contact' },
        travelContacts: { title: '随行联系人名单', $ref: '#/$defs/contactList' },
        backupContacts: { title: '备用联系人名单', $ref: '#/$defs/contactList', maxItems: 2 },
        emergencyContact: { title: '紧急联系人', $ref: '#/$defs/contact', required: ['phone'] },
      },
      if: { required: ['trip'], properties: { trip: { const: '境外' } } },
      then: { required: ['passportNo'] },
      $defs: {
        contactList: {
          title: '联系人名单定义',
          type: 'array',
          minItems: 1,
          items: { $ref: '#/$defs/contact' },
        },
        contact: {
          title: '联系人定义',
          type: 'object',
          required: ['name'],
          properties: {
            name: { title: '姓名', type: 'string' },
            phone: { title: '电话', type: 'string', minLength: 1 },
          },
        },
      },
    };
    let schema = structuredClone(original),
      path = ['properties', 'passportNo'],
      mode = '可视化',
      draft,
      raw,
      dirty = false;
    const history = [],
      $ = (id) => document.getElementById(id),
      types = ['object', 'array', 'string', 'number', 'integer', 'boolean', 'null'];
    const at = (value, p) => p.reduce((v, k) => v[k], value),
      ptr = (p) =>
        '#' + p.map((k) => '/' + String(k).replaceAll('~', '~0').replaceAll('/', '~1')).join('');
    const kind = (v) => (v === null ? 'null' : Array.isArray(v) ? 'array' : typeof v);
    const obj = (v) => kind(v) === 'object';
    function el(tag, text, cls) {
      const n = document.createElement(tag);
      if (text !== undefined) n.textContent = text;
      if (cls) n.className = cls;
      return n;
    }
    function button(label, fn, cls) {
      const b = el('button', label, cls);
      b.onclick = fn;
      return b;
    }
    function msg(s) {
      $('status').textContent = s;
    }
    function changed() {
      dirty = true;
      $('undo').disabled = false;
      msg('有未应用的修改');
    }
    function reset() {
      draft = structuredClone(at(schema, path));
      raw = JSON.stringify(draft, null, 2);
      dirty = false;
    }
    function apply() {
      try {
        if (!dirty) return true;
        const invalid = $('panel').querySelector(':invalid');
        if (invalid) {
          invalid.reportValidity();
          return false;
        }
        const v = mode === 'JSON' ? JSON.parse(raw) : draft;
        if (!obj(v) && typeof v !== 'boolean') throw Error('Schema 节点须为对象或布尔值');
        history.push(structuredClone(schema));
        if (path.length) assign(at(schema, path.slice(0, -1)), path.at(-1), v);
        else schema = v;
        reset();
        render();
        msg('已应用到本页草稿');
        return true;
      } catch (e) {
        msg('请修正当前节点：' + e.message);
        return false;
      }
    }
    const expandedDefinitions = new Set();
    function openNode(p) {
      if (!apply()) return;
      if (p[0] === '$defs') expandedDefinitions.add(p[1]);
      path = p;
      reset();
      render();
      msg('');
    }
    function setMode(m) {
      if (!apply()) return;
      mode = m;
      reset();
      render();
      msg('');
    }
    const mapKeys = ['properties', 'patternProperties', '$defs', 'dependentSchemas'],
      listKeys = ['allOf', 'oneOf', 'anyOf', 'prefixItems'],
      singleKeys = [
        'if',
        'then',
        'else',
        'not',
        'items',
        'contains',
        'additionalProperties',
        'unevaluatedProperties',
        'unevaluatedItems',
        'propertyNames',
        'contentSchema',
      ];
    function children(v) {
      if (!obj(v)) return [];
      const a = [];
      for (const k of mapKeys)
        if (obj(v[k])) for (const s of Object.keys(v[k])) a.push([[k, s], s]);
      for (const k of listKeys)
        if (Array.isArray(v[k])) v[k].forEach((_, i) => a.push([[k, i], k + ' ' + (i + 1)]));
      for (const k of singleKeys) if (Object.hasOwn(v, k)) a.push([[k], k]);
      return a;
    }
    function label(v, k) {
      return (
        (obj(v) && typeof v.title === 'string' && v.title) ||
        { if: '如果 · 条件', then: '满足时 · 约束', else: '否则 · 约束' }[k] ||
        String(k)
      );
    }
    const structuralKeys = new Set(['properties', 'patternProperties', 'items', 'prefixItems']);
    function structuralOwner() {
      let p = path[0] === '$defs' && path.length >= 2 ? path.slice(0, 2) : [],
        v = at(schema, p);
      while (p.length < path.length) {
        const edge = children(v).find(
          ([tail]) => structuralKeys.has(tail[0]) && tail.every((k, i) => path[p.length + i] === k),
        );
        if (!edge) break;
        p = p.concat(edge[0]);
        v = at(v, edge[0]);
      }
      return p;
    }
    function renderTree() {
      const owner = ptr(structuralOwner());
      const nav = $('tree');
      nav.replaceChildren();
      const defs = $('defTree');
      defs.replaceChildren();
      function walk(container, v, p, k, depth) {
        const b = button(
          label(v, names[k] || k),
          () => openNode(p),
          ptr(p) === owner ? 'active' : '',
        );
        b.style.paddingLeft = 8 + depth * 11 + 'px';
        b.title = ptr(p);
        b.append(
          el(
            'span',
            v?.$ref
              ? '引用'
              : typeof v === 'boolean'
                ? '开关'
                : Array.isArray(v?.type)
                  ? '多类型'
                  : v?.type || '',
            'tag',
          ),
        );
        if (p[0] === '$defs' && p.length === 2) {
          const expanded = expandedDefinitions.has(p[1]),
            r = el('div', undefined, 'tree-ref');
          const toggle = button(
            expanded ? '▾' : '▸',
            () => {
              if (expanded) expandedDefinitions.delete(p[1]);
              else expandedDefinitions.add(p[1]);
              renderTree();
            },
            'expander',
          );
          toggle.setAttribute('aria-label', (expanded ? '收起' : '展开') + label(v, k));
          toggle.setAttribute('aria-expanded', String(expanded));
          r.append(toggle, b);
          container.append(r);
          if (!expanded) return;
        } else container.append(b);
        for (const [tail, name] of children(v))
          if (structuralKeys.has(tail[0]))
            walk(
              container,
              at(v, tail),
              p.concat(tail),
              tail[0] === 'prefixItems' ? '第 ' + (tail[1] + 1) + ' 项' : name,
              depth + 1,
            );
      }
      walk(nav, schema, [], '根模型', 0);
      for (const [key, value] of Object.entries(schema.$defs || {}))
        walk(defs, value, ['$defs', key], key, 0);
    }
    function input(value, cb, aria) {
      const n = el('input');
      n.value = value;
      n.setAttribute('aria-label', aria);
      n.oninput = () => cb(n.value);
      return n;
    }
    function select(opts, value, cb, name) {
      const s = el('select');
      s.setAttribute('aria-label', name);
      for (const x of opts) {
        const o = el('option', x);
        o.value = x;
        s.append(o);
      }
      s.value = value;
      s.onchange = () => cb(s.value);
      return s;
    }
    const names = {
      properties: '字段',
      patternProperties: '按名称模式匹配字段',
      $defs: '共享定义',
      dependentSchemas: '属性出现时的附加模型',
      allOf: '同时满足',
      anyOf: '至少满足一项',
      oneOf: '恰好满足一项',
      not: '排除模型',
      if: '当条件成立',
      then: '成立时应用',
      else: '否则应用',
      items: '每一项',
      prefixItems: '固定位置元素',
      contains: '数组中须匹配',
      additionalProperties: '其他属性',
      unevaluatedProperties: '尚未求值的属性',
      unevaluatedItems: '尚未求值的元素',
      propertyNames: '属性名约束',
      contentSchema: '编码内容的模型',
    };
    const cn = {
      string: '文本',
      number: '数值',
      integer: '整数',
      boolean: '布尔值',
      object: '对象',
      array: '数组',
      null: '空值',
    };
    function assign(target, k, v) {
      Object.defineProperty(target, k, {
        value: v,
        configurable: true,
        writable: true,
        enumerable: true,
      });
    }
    function row(box, name, control) {
      const r = el('label', undefined, 'field');
      r.append(el('span', name), control);
      box.append(r);
      return control;
    }
    function pick(entries, current, name) {
      const s = el('select');
      s.setAttribute('aria-label', name);
      for (const [v, l] of entries) {
        const o = el('option', l);
        o.value = v;
        s.append(o);
      }
      s.value = current;
      return s;
    }
    function section(box, title, open = false) {
      const d = el('details');
      d.open = open;
      d.append(el('summary', title));
      box.append(d);
      return d;
    }
    function transact(fn, next, message) {
      history.push(structuredClone(schema));
      fn();
      path = next;
      if (path[0] === '$defs') expandedDefinitions.add(path[1]);
      reset();
      render();
      msg(message);
    }
    function dialog(title, build, submit, ok) {
      $('dialogTitle').textContent = title;
      $('body').replaceChildren();
      $('err').textContent = '';
      $('confirm').textContent = ok || '确认';
      build($('body'));
      $('form').onsubmit = (e) => {
        e.preventDefault();
        try {
          submit();
          $('dialog').close();
        } catch (error) {
          $('err').textContent = error.message;
        }
      };
      $('dialog').showModal();
    }
    $('cancel').onclick = () => $('dialog').close();
    function openAdd(defaultKind, base = path) {
      if (!apply()) return;
      const node = at(schema, base);
      if (!obj(node)) {
        msg('请先选择对象形式的模型节点');
        return;
      }
      let group, key, title, type;
      function refresh() {
        key.parentElement.hidden = !mapKeys.includes(group.value);
        key.required = mapKeys.includes(group.value);
      }
      dialog(
        '新增模型节点',
        (box) => {
          box.append(el('p', '添加位置　' + ptr(base), 'path'));

        }
        let caption = names[p[0]] || k;
        if (p.length > 1)
          caption += ' · ' + (typeof p[1] === 'number' ? '分支 ' + (p[1] + 1) : p[1]);
        if (item?.title) caption += '　' + item.title;
        const card = el('section', undefined, 'flow');
        card.append(
          el('strong', caption),
          button('编辑', () => ruleNode(card, '编辑' + caption, path.concat(p), item), 'tiny'),
          button(
            '删除',
            () => confirmRemoval(card, '删除' + caption, (next) => dropNode(next, path.concat(p))),
            'tiny',
          ),
        );
        rules.append(card);
      }
      for (const [key, vals] of Object.entries(draft.dependentRequired || {})) {
        const card = el('section', undefined, 'flow');
        card.append(
          el('p', key + ' 出现时须有 ' + vals.join('、')),
          button('编辑依赖', () => dependencyEditor(card, key), 'tiny'),
          button(
            '删除依赖',
            () =>
              confirmRemoval(card, '删除属性依赖', (next) => {
                const n = at(next, path);
                delete n.dependentRequired[key];
                if (!Object.keys(n.dependentRequired).length) delete n.dependentRequired;
              }),
            'tiny',
          ),
        );
        rules.append(card);
      }
      panel.append(advanced);
    }
    function renderPanel() {
      const p = $('panel');
      p.replaceChildren();
      if (path[0] === '$defs' && path.length > 1) {
        const shared = el('div', undefined, 'shared-context');
        shared.append(
          el('strong', '正在编辑共享模型 · ' + label(schema.$defs[path[1]], path[1])),
          el('div', '修改会用于下列引用此模型的字段。', 'note'),
        );
        usageList(shared, path[1]);
        p.append(shared);
      }
      if (mode === '可视化') props(p);
      else {
        const a = el('textarea');
        a.setAttribute('aria-label', '当前节点 JSON');
        a.value = raw;
        a.oninput = () => {
          raw = a.value;
          changed();
        };
        p.append(a);
      }
    }
    function render() {
      renderTree();
      const owner = structuralOwner();
      $('path').replaceChildren();
      if (owner.length < path.length) {
        $('path').append(
          button(
            '返回' + label(at(schema, owner), owner.at(-1) || '根模型'),
            () => openNode(owner),
            'tiny',
          ),
          document.createTextNode('　'),
        );
      }
      $('path').append(document.createTextNode(ptr(path)));
      $('title').textContent = label(draft, names[path.at(-1)] || path.at(-1) || '根模型');
      $('modes').replaceChildren(
        ...['可视化', 'JSON'].map((m) => button(m, () => setMode(m), m === mode ? 'active' : '')),
      );
      $('undo').disabled = !dirty && !history.length;
      $('arrayChild').hidden = at(schema, path)?.type !== 'array';
      $('arrayChild').textContent =
        obj(draft) && Object.hasOwn(draft, 'items') ? '＋ 固定位置元素' : '＋ 数组元素';
      $('remove').disabled = !path.length || (path.length === 2 && path[0] === '$defs');
      renderPanel();
    }
    $('arrayChild').onclick = () =>
      openAdd(obj(draft) && Object.hasOwn(draft, 'items') ? 'prefixItems' : 'items');
    $('coverage').onclick = showCoverage;
    $('apply').onclick = apply;
    $('undo').onclick = () => {
      if (!dirty && history.length) {
        schema = history.pop();
        while (path.length) {
          try {
            if (
              at(schema, path) !== undefined &&
              !mapKeys.includes(path.at(-1)) &&
              !listKeys.includes(path.at(-1))
            )
              break;
          } catch {}
          path.pop();
        }
      }
      reset();
      render();
      msg('已撤销');
    };
    reset();
    render();
  </script>
</html>
