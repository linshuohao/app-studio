<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>旅险投保 · 字段配置设计预览</title>
    <link rel="stylesheet" href="../apps/studio/src/app/studio-ui.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      html {
        font-size: 13px;
      }
      body {
        margin: 0;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        color: var(--studio-text);
        background: var(--studio-surface);
        font: var(--studio-type-body);
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font: var(--studio-type-title);
      }
      h2,
      h3 {
        font: var(--studio-type-section);
      }
      button,
      select,
      input {
        font: inherit;
      }
      button,
      summary,
      select {
        cursor: pointer;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      summary:focus-visible {
        outline: 2px solid var(--studio-focus-ring);
        outline-offset: 2px;
      }
      [hidden] {
        display: none !important;
      }
      .top,
      .head,
      .tabs,
      .row,
      footer,
      .nodehead {
        display: flex;
        align-items: center;
        gap: var(--studio-space-12);
      }
      .top,
      .head,
      .tabs {
        padding-inline: 24px;
      }
      .top {
        min-height: 48px;
        border-bottom: 1px solid var(--studio-border);
        color: var(--studio-text-muted);
        justify-content: space-between;
      }
      .top select {
        margin-left: 8px;
      }
      .head {
        padding-block: 16px;
      }
      .push {
        margin-left: auto;
      }
      .tabs {
        min-height: 40px;
        gap: 24px;
        border-bottom: 1px solid var(--studio-border);
        color: var(--studio-text-muted);
      }
      .tabs strong {
        align-self: stretch;
        display: grid;
        place-content: center;
        border-bottom: 2px solid var(--studio-primary);
        color: var(--studio-text);
      }
      main {
        min-height: 0;
        flex: 1;
        display: grid;
        grid-template-columns: 224px minmax(0, 1fr);
      }
      aside {
        padding: 16px 12px;
        overflow: auto;
        border-right: 1px solid var(--studio-border);
        background: var(--studio-bg);
      }
      aside h2 {
        padding: 0 8px;
        margin: 8px 0;
      }
      aside h2:not(:first-child) {
        margin-top: 24px;
      }
      .node {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 6px;
        text-align: left;
        min-height: 36px;
        border: 0;
        border-radius: 4px;
        background: transparent;
        color: inherit;
        padding-right: 8px;
      }
      .node:hover {
        background: var(--studio-hover);
      }
      .node[aria-current='true'] {
        background: var(--studio-selected);
        color: var(--studio-info-fg);
        font-weight: 600;
      }
      .node small {
        margin-left: auto;
        font: var(--studio-type-caption);
        color: var(--studio-text-muted);
      }
      article {
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .scroll {
        overflow: auto;
        padding: 24px;
        flex: 1;
      }
      .intro {
        padding-bottom: 16px;
        border-bottom: 1px solid var(--studio-border);
      }
      code,
      pre {
        font: var(--studio-type-code);
        overflow-wrap: anywhere;
      }
      .muted,
      small,
      code {
        color: var(--studio-text-muted);
      }
      .nodehead {
        margin-bottom: 4px;
      }
      .pill {
        font: var(--studio-type-caption);
        background: var(--studio-surface-muted);
        padding: 2px 8px;
        border-radius: 4px;
      }
      .block {
        padding: 24px 0;
        border-bottom: 1px solid var(--studio-border);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
        margin-top: 16px;
      }
      label.field {
        display: grid;
        align-content: start;
        gap: 8px;
        font: var(--studio-type-control);
      }
      input:not([type='checkbox']),
      select {
        min-height: 36px;
        border: 1px solid var(--studio-control-border);
        border-radius: 4px;
        padding: 4px 10px;
        color: inherit;
        background: var(--studio-surface);
        min-width: 0;
      }
      input:read-only {
        border-color: var(--studio-border);
      }
      .check {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 16px;
      }
      .check input {
        width: 16px;
        height: 16px;
      }
      .rule {
        margin-top: 12px;
        padding: 12px 16px;
        background: var(--studio-surface-muted);
        border-radius: 8px;
      }
      .rule p + p {
        margin-top: 6px;
      }
      summary {
        font: var(--studio-type-section);
      }
      footer {
        min-height: 64px;
        border-top: 1px solid var(--studio-border);
        padding: 8px 24px;
      }
      dialog {
        width: min(640px, 90vw);
        max-height: 80dvh;
        border: 1px solid var(--studio-border);
        border-radius: 8px;
        padding: 24px;
      }
      pre {
        white-space: pre-wrap;
        background: var(--studio-bg);
        padding: 16px;
        max-height: 48dvh;
        overflow: auto;
      }
      .back {
        display: none;
      }
      a {
        color: var(--studio-info-fg);
      }
      @media (max-width: 719px) {
        main {
          grid-template-columns: 1fr;
        }
        main:not(.detail) article,
        main.detail aside {
          display: none;
        }
        .back {
          display: inline-block;
        }
        .grid {
          grid-template-columns: 1fr;
        }
        .head,
        .top {
          flex-wrap: wrap;
        }
        .tabs {
          gap: 12px;
        }
        .top,
        .head,
        .tabs,
        .scroll,
        footer {
          padding-inline: 16px;
        }
      }
    </style>
  </head>
  <body>
    <header class="top">
      <span>表单　/　旅险投保申请　/　投保配置</span
      ><label
        >预览模式<select id="access">
          <option>编辑配置</option>
          <option>查看配置</option>
        </select></label
      >
    </header>
    <div class="head">
      <h1>投保配置</h1>
      <span id="state" class="pill" role="status">已保存</span
      ><button class="studio-button push" data-variant="primary" id="save">保存配置</button>
    </div>
    <nav class="tabs" aria-label="配置分区">
      <strong aria-current="page">字段</strong><span>布局</span><span>联动</span><span>校验</span
      ><button class="studio-button push" data-variant="text" id="json">JSON 原文</button>
    </nav>
    <main>
      <aside aria-label="字段大纲"></aside>
      <article>
        <div class="scroll">
          <header class="intro">
            <button class="studio-button back" data-variant="text" id="back">返回大纲</button>
            <div class="nodehead">
              <h1 id="title"></h1>
              <span id="type" class="pill"></span>
            </div>
            <code id="path"></code>
          </header>
          <form id="attrs">
            <section class="block">
              <h2>字段属性</h2>
              <div id="fields" class="grid"></div>
              <label class="check" id="requiredRow"
                ><input id="required" type="checkbox" />始终必填</label
              >
            </section>
            <section class="block" id="rules"></section>
            <details class="block" id="advanced">
              <summary>高级配置</summary>
              <div class="grid" id="extras"></div>
            </details>
          </form>
        </div>
        <footer>
          <span id="notice" role="status" class="muted"></span
          ><button class="studio-button push" data-variant="secondary" id="undo">撤销</button
          ><button class="studio-button" data-variant="primary" id="apply" form="attrs">
            应用属性修改
          </button>
        </footer>
      </article>
    </main>
    <dialog id="source">
      <div class="row">
        <h2>配置原文</h2>
        <button
          class="studio-button push"
          data-variant="secondary"
          onclick="this.closest('dialog').close()"
        >
          关闭
        </button>
      </div>
      <pre></pre>
    </dialog>
    <dialog id="pending">
      <h2>当前属性尚未应用</h2>
      <p style="margin: 16px 0">切换前可将修改应用到本页草稿，或放弃此次输入。</p>
      <div class="row">
        <button class="studio-button" data-variant="secondary" id="stay">继续编辑</button
        ><button class="studio-button" data-variant="secondary" id="discard">放弃修改</button
        ><button class="studio-button" id="applyGo">应用并继续</button>
      </div>
    </dialog>
    <script>
      const $ = (id) => document.getElementById(id);
      const initial = {
        title: '旅险投保申请',
        type: 'object',
        properties: {
          trip: { title: '行程类型', type: 'string', enum: ['境内', '境外'] },
          passportNo: {
            title: '护照号码',
            type: 'string',
            description: '填写证件资料页上的护照号码。',
            minLength: 6,
            maxLength: 12,
          },
          insured: {
            title: '被保险人',
            type: 'array',
            minItems: 1,
            items: {
              title: '每位被保险人',
              type: 'object',
              properties: {
                name: { title: '姓名', $ref: '#/$defs/personName' },
                age: { title: '年龄', type: 'integer', minimum: 0, maximum: 110 },
              },
              required: ['name'],
            },
          },
          contact: { title: '联系人姓名', $ref: '#/$defs/personName' },
        },
        required: ['trip'],
        if: { required: ['trip'], properties: { trip: { const: '境外' } } },
        then: { required: ['passportNo'] },
        $defs: { personName: { title: '人员姓名', type: 'string', minLength: 1, maxLength: 40 } },
      };
      let schema = structuredClone(initial),
        saved = JSON.stringify(schema),
        path = ['properties', 'passportNo'],
        dirty = false,
        nextAction;
      const history = [],
        names = { object: '对象', array: '数组', string: '文本', integer: '整数' };
      const at = (p) => p.reduce((n, k) => n[k], schema),
        node = () => at(path),
        view = () => $('access').selectedIndex === 1;
      const pointer = (p) => '/data/schema' + p.map((k) => '/' + k).join('');
      function make(tag, text) {
        const n = document.createElement(tag);
        if (text !== undefined) n.textContent = text;
        return n;
      }
      function activate(p) {
        path = p;
        document.querySelector('main').classList.add('detail');
        render();
        document.querySelector('.scroll').scrollTop = 0;
      }
      function guard(fn) {
        if (!dirty) return fn();
        nextAction = fn;
        $('pending').showModal();
      }
      function tree() {
        const box = document.querySelector('aside');
        box.replaceChildren();
        function walk(p, depth) {
          const n = at(p),
            b = make('button', n.title || p.at(-1));
          b.className = 'node';
          b.style.paddingLeft = 8 + depth * 12 + 'px';
          b.setAttribute('aria-current', String(pointer(path) === pointer(p)));
          b.append(make('small', n.$ref ? '引用' : names[n.type]));
          b.onclick = () => guard(() => activate(p));
          box.append(b);
          for (const k of Object.keys(n.properties || {})) walk([...p, 'properties', k], depth + 1);
          if (n.items) walk([...p, 'items'], depth + 1);
        }
        box.append(make('h2', '表单结构'));
        walk([], 0);
        box.append(make('h2', '共享定义'));
        for (const k of Object.keys(schema.$defs)) walk(['$defs', k], 0);
      }
      function field(host, key, label, kind = 'text', help = '') {
        const l = make('label', label);
        l.className = 'field';
        const i = make('input');
        i.name = key;
        i.type = kind;
        i.readOnly = view();
        i.value = node()[key] ?? '';
        if (['minLength', 'maxLength', 'minItems', 'maxItems'].includes(key)) i.min = 0;
        if (key === 'title') i.required = true;
        l.append(i);
        if (help) l.append(make('small', help));
        host.append(l);
      }
      function update() {
        const modified = JSON.stringify(schema) !== saved;
        $('state').textContent = view()
          ? '只读'
          : dirty
            ? '属性待应用'
            : modified
              ? '有未保存的更改'
              : '已保存';
        $('apply').disabled = !dirty;
        $('undo').disabled = !dirty && !history.length;
        $('save').disabled = dirty || !modified;
        $('notice').textContent = dirty ? '应用后可保存配置。' : '';
      }
      function render() {
        dirty = false;
        tree();
        const n = node(),
          r = view();
        $('title').textContent = n.title;
        $('type').textContent = n.$ref ? '共享引用' : names[n.type];
        $('path').textContent = pointer(path);
        for (const id of ['apply', 'undo', 'save']) $(id).hidden = r;
        const host = $('fields');
        host.replaceChildren();
        field(host, 'title', '显示名称');
        field(host, 'description', '字段说明', 'text', '说明这个字段需要填写什么。');
        const pair =
          n.type === 'string'
            ? ['minLength', '最少字符', 'maxLength', '最多字符']
            : n.type === 'integer'
              ? ['minimum', '最小值', 'maximum', '最大值']
              : n.type === 'array'
                ? ['minItems', '最少元素', 'maxItems', '最多元素']
                : null;
        if (pair) {
          field(host, pair[0], pair[1], 'number');
          field(host, pair[2], pair[3], 'number');
        }
        const isProp = path.at(-2) === 'properties';
        $('requiredRow').hidden = !isProp;
        $('required').checked = !!(isProp && at(path.slice(0, -2)).required?.includes(path.at(-1)));
        $('required').disabled = r;
        const rules = $('rules');
        rules.replaceChildren();
        const ref = n.$ref,
          shared = path[0] === '$defs';
        rules.hidden = !(
          ref ||
          shared ||
          path.length === 0 ||
          path.join('/') === 'properties/passportNo'
        );
        if (!rules.hidden) {
          rules.append(make('h2', ref ? '引用目标' : shared ? '使用位置' : '条件必填'));
          const card = make('div');
          card.className = 'rule';
          rules.append(card);
          if (ref || shared) {
            const targets = ref
              ? [['$defs', ref.split('/').at(-1)]]
              : [
                  ['properties', 'contact'],
                  ['properties', 'insured', 'items', 'properties', 'name'],
                ];
            for (const p of targets) {
              const b = make('button', at(p).title + '　' + pointer(p));
              b.type = 'button';
              b.className = 'studio-button';
              b.dataset.variant = 'text';
              b.onclick = () => guard(() => activate(p));
              card.append(b);
            }
          } else {
            card.append(
              make('p', '当「行程类型」为「境外」时，「护照号码」必填。'),
              make('small', '规则归属：表单根对象。'),
            );
          }
        }
        $('advanced').hidden = n.type !== 'string';
        $('advanced').open = false;
        $('extras').replaceChildren();
        if (n.type === 'string') {
          field($('extras'), 'format', '格式名称', 'text', '例如 email。当前引擎仅记录此标记。');
          field($('extras'), 'pattern', '正则匹配', 'text', '例如 ^[A-Z0-9]+$。');
        }
        update();
      }
      function apply() {
        if (!dirty) return true;
        if (!$('attrs').reportValidity()) return false;
        const inputs = [...$('attrs').querySelectorAll('input[name]')];
        for (const [lo, hi] of [
          ['minLength', 'maxLength'],
          ['minimum', 'maximum'],
          ['minItems', 'maxItems'],
        ]) {
          const a = inputs.find((i) => i.name === lo),
            b = inputs.find((i) => i.name === hi);
          if (a?.value && b?.value && +a.value > +b.value) {
            $('notice').textContent = '下限不能大于上限。';
            return false;
          }
        }
        history.push(structuredClone(schema));
        for (const i of inputs) {
          if (i.value === '') delete node()[i.name];
          else node()[i.name] = i.type === 'number' ? Number(i.value) : i.value;
        }
        if (path.at(-2) === 'properties') {
          const parent = at(path.slice(0, -2)),
            keys = new Set(parent.required || []);
          if ($('required').checked) keys.add(path.at(-1));
          else keys.delete(path.at(-1));
          if (keys.size) parent.required = [...keys];
          else delete parent.required;
        }
        render();
        return true;
      }
      $('attrs').oninput = () => {
        dirty = true;
        update();
      };
      $('attrs').onsubmit = (e) => {
        e.preventDefault();
        apply();
      };
      $('save').onclick = () => {
        saved = JSON.stringify(schema);
        update();
        $('notice').textContent = '已保存到本次预览。';
      };
      $('undo').onclick = () => {
        if (!dirty) schema = history.pop();
        render();
      };
      $('json').onclick = () =>
        guard(() => {
          document.querySelector('pre').textContent = JSON.stringify({ data: { schema } }, null, 2);
          $('source').showModal();
        });
      $('stay').onclick = () => $('pending').close();
      $('discard').onclick = () => {
        $('pending').close();
        render();
        nextAction();
      };
      $('applyGo').onclick = () => {
        $('pending').close();
        if (apply()) nextAction();
      };
      $('access').onchange = () => {
        const target = $('access').selectedIndex;
        if (dirty) $('access').selectedIndex = 0;
        guard(() => {
          $('access').selectedIndex = target;
          render();
        });
      };
      $('back').onclick = () =>
        guard(() => document.querySelector('main').classList.remove('detail'));
      render();
    </script>
  </body>
</html>
