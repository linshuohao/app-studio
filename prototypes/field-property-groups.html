<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>字段属性 · 分组评审</title>
    <link rel="stylesheet" href="../apps/studio/src/app/studio-ui.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      html {
        font-size: 13px;
      }
      body {
        margin: 0;
        color: var(--studio-text);
        background: var(--studio-bg);
        font: var(--studio-type-body);
      }
      header {
        height: 48px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 24px;
        background: var(--studio-surface);
        border-bottom: 1px solid var(--studio-border);
        color: var(--studio-text-muted);
      }
      header b {
        color: var(--studio-text);
      }
      main {
        margin: 24px;
        min-width: 0;
      }
      h1 {
        font: var(--studio-type-title);
        margin: 0 0 16px;
      }
      h2,
      h3,
      p {
        margin: 0;
      }
      h2,
      h3,
      summary {
        font: var(--studio-type-section);
      }
      .sheet {
        background: var(--studio-surface);
        border: 1px solid var(--studio-border);
        border-radius: 8px;
        overflow: hidden;
      }
      [role='tablist'] {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      button {
        font: var(--studio-type-control);
        cursor: pointer;
      }
      #groups {
        padding: 0 16px;
        border-bottom: 1px solid var(--studio-border);
      }
      #groups button {
        min-width: 88px;
        height: 44px;
        background: none;
        color: var(--studio-text-muted);
        border: 0;
        border-bottom: 2px solid transparent;
      }
      #groups [aria-selected='true'] {
        color: var(--studio-text);
        border-bottom-color: var(--studio-primary);
      }
      #types {
        margin: 0 0 24px;
      }
      #types button {
        height: 36px;
        padding: 0 16px;
        color: var(--studio-text-muted);
        background: var(--studio-surface);
        border: 1px solid var(--studio-border);
        border-radius: 4px;
      }
      #types [aria-selected='true'] {
        background: var(--studio-selected);
        color: var(--studio-info-fg);
        border-color: var(--studio-info-border);
      }
      .content {
        padding: 24px;
      }
      .example {
        color: var(--studio-text-muted);
        margin: 4px 0 16px;
      }
      .property {
        display: grid;
        grid-template-columns: minmax(136px, 220px) minmax(0, 1fr);
        gap: 16px;
        align-items: start;
        padding: 16px 0;
        border-top: 1px solid var(--studio-border);
      }
      .name {
        font: var(--studio-type-control);
      }
      code {
        display: block;
        color: var(--studio-text-muted);
        font: var(--studio-type-code);
        overflow-wrap: anywhere;
      }
      .value {
        display: block;
        width: min(100%, 480px);
        border: 1px solid var(--studio-control-border);
        border-radius: 4px;
        background: var(--studio-surface);
        color: var(--studio-text);
        padding: 6px 10px;
        min-height: 36px;
        font: var(--studio-type-body);
      }
      small,
      .empty {
        display: block;
        color: var(--studio-text-muted);
        font: var(--studio-type-caption);
      }
      small {
        margin-top: 6px;
      }
      h3 {
        padding-bottom: 12px;
      }
      details {
        border-top: 1px solid var(--studio-control-border);
        margin-top: 4px;
      }
      summary {
        cursor: pointer;
        padding: 16px 0;
      }
      summary span {
        font: var(--studio-type-caption);
        color: var(--studio-text-muted);
        margin-left: 8px;
      }
      .empty {
        padding: 8px 0 16px;
      }
      button:focus-visible,
      summary:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 2px solid var(--studio-focus-ring);
        outline-offset: 2px;
      }
      [hidden] {
        display: none !important;
      }
      @media (max-width: 620px) {
        main {
          margin: 16px;
        }
        .content {
          padding: 16px;
        }
        .property {
          grid-template-columns: 1fr;
          gap: 8px;
        }
      }

      .property {
        grid-template-columns: minmax(135px, 0.8fr) minmax(230px, 1.55fr) minmax(160px, 1fr);
      }
      .property > div {
        min-width: 0;
      }
      .spec {
        font: var(--studio-type-caption);
        color: var(--studio-text-muted);
      }
      .spec strong {
        display: block;
        margin-bottom: 4px;
        color: var(--studio-text);
        font: var(--studio-type-control);
      }
      input:not([type='checkbox']),
      textarea,
      select {
        box-sizing: border-box;
        max-width: 100%;
        padding: 6px 10px;
        min-height: 36px;
        border: 1px solid var(--studio-control-border);
        border-radius: 4px;
        color: inherit;
        background: white;
        font: inherit;
      }
      textarea {
        width: 100%;
        resize: vertical;
      }
      input:not([type='checkbox']) {
        width: min(100%, 320px);
      }
      input[type='number'] {
        max-width: 12em;
      }
      textarea.raw {
        font: var(--studio-type-code);
      }
      label {
        display: inline-flex;
        gap: 6px;
        align-items: center;
      }
      .inline {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }
      .stack {
        display: grid;
        gap: 8px;
      }
      .stack > button {
        justify-self: start;
      }
      .property button {
        padding: 4px 10px;
        min-height: 32px;
        border: 1px solid var(--studio-border);
        border-radius: 4px;
        background: var(--studio-surface-muted);
        color: inherit;
      }
      .property fieldset {
        margin: 0;
        min-width: 0;
        padding: 8px 12px;
        border: 1px solid var(--studio-border);
        border-radius: 4px;
      }
      .property legend {
        font: var(--studio-type-caption);
      }
      .content > p {
        margin: 0 0 16px;
        color: var(--studio-text-muted);
      }
      .sources {
        padding: 16px 0;
      }
      .sources a {
        color: var(--studio-info-fg);
      }
      @media (max-width: 800px) {
        .property {
          grid-template-columns: minmax(110px, 0.6fr) minmax(0, 1.5fr);
        }
        .spec {
          grid-column: 2;
        }
      }
      @media (max-width: 520px) {
        .property {
          grid-template-columns: 1fr;
        }
        .spec {
          grid-column: auto;
        }
      }
    </style>
  </head>
  <body>
    <header><b>Studio</b><span>/</span>表单配置<span>/</span>字段</header>
    <main>
      <h1>字段属性 · 输入控件评审</h1>
      <div class="sheet">
        <nav id="groups" role="tablist" aria-label="属性分组"></nav>
        <section id="common" class="content" role="tabpanel"></section>
        <section id="specific" class="content" role="tabpanel" hidden>
          <nav id="types" role="tablist" aria-label="数据类型"></nav>
          <div id="panels"></div>
        </section>
      </div>
      <footer class="sources">
        协议依据　<a href="https://json-schema.org/draft/2020-12/json-schema-core"
          >JSON Schema Core 2020-12</a
        >　<a href="https://json-schema.org/draft/2020-12/json-schema-validation"
          >Validation 2020-12</a
        >　<a href="../docs/design/platform-studio.md">Studio 设计规范</a>
      </footer>
    </main>
    <script>
      const byId = (id) => document.getElementById(id);
      const el = (tag, text) => {
        const n = document.createElement(tag);
        if (text !== undefined) n.textContent = text;
        return n;
      };
      function tabs(host, entries) {
        const buttons = entries.map(([id, label]) => {
          const b = el('button', label);
          b.type = 'button';
          b.id = 'tab-' + id;
          b.setAttribute('role', 'tab');
          b.setAttribute('aria-controls', id);
          byId(id).setAttribute('aria-labelledby', b.id);
          host.append(b);
          return b;
        });
        function choose(i) {
          buttons.forEach((b, j) => {
            b.setAttribute('aria-selected', i === j);
            b.tabIndex = i === j ? 0 : -1;
            byId(entries[j][0]).hidden = i !== j;
          });
        }
        buttons.forEach((b, i) => {
          b.onclick = () => choose(i);
          b.onkeydown = (e) => {
            const index = {
              ArrowRight: (i + 1) % buttons.length,
              ArrowLeft: (i + buttons.length - 1) % buttons.length,
              Home: 0,
              End: buttons.length - 1,
            }[e.key];
            if (index !== undefined) {
              e.preventDefault();
              choose(index);
              buttons[index].focus();
            }
          };
        });
        choose(0);
      }
      const kinds = {
        string: '文本',
        integer: '整数',
        number: '数值',
        boolean: '布尔',
        object: '对象',
        array: '数组',
        null: '空值',
      };
      const keys = Object.keys(kinds);
      function group(...nodes) {
        const e = el('div');
        e.className = 'inline';
        e.append(...nodes);
        return e;
      }
      function stack(...nodes) {
        const e = group(...nodes);
        e.className = 'stack';
        return e;
      }
      function input(label, value = '', type = 'text') {
        const e = el('input');
        e.type = type;
        e.value = value;
        e.setAttribute('aria-label', label);
        return e;
      }
      function select(label, options) {
        const e = el('select');
        e.setAttribute('aria-label', label);
        for (const o of options) {
          const opt = el('option', o);
          e.append(opt);
        }
        return e;
      }
      function area(label, value, raw = false) {
        const e = el('textarea');
        e.rows = raw ? 3 : 2;
        e.value = value;
        e.className = raw ? 'raw' : '';
        e.setAttribute('aria-label', label);
        return e;
      }
      function check(label, on = false) {
        const e = input(label, '', 'checkbox');
        e.checked = on;
        const l = el('label');
        l.append(e, label);
        return l;
      }
      function btn(label, fn) {
        const b = el('button', label);
        b.onclick = fn;
        return b;
      }
      function num(label, value, step = '1', min) {
        const n = input(label, value, 'number');
        n.step = step;
        if (min !== undefined) n.min = min;
        return n;
      }
      function tagged(label, node) {
        const f = el('fieldset');
        f.append(el('legend', label), node);
        return f;
      }
      function list(label, make, start = 1, ordered = false) {
        const box = stack(),
          items = stack();
        function add() {
          const line = group(make(items.children.length));
          const del = btn('移除', () => {
            line.remove();
            addBtn.focus();
          });
          if (ordered) {
            line.append(
              btn('上移', () => {
                if (line.previousElementSibling)
                  items.insertBefore(line, line.previousElementSibling);
              }),
              btn('下移', () => {
                if (line.nextElementSibling) items.insertBefore(line.nextElementSibling, line);
              }),
            );
          }
          line.append(del);
          items.append(line);
        }
        const addBtn = btn('添加' + label, add);
        box.append(items, addBtn);
        for (let i = 0; i < start; i++) add();
        return box;
      }
      function schema(label, seed = { type: 'string' }) {
        const mode = select(label + '方式', [
          '自定义模型',
          '引用共享定义',
          '允许任意值',
          '禁止任意值',
        ]);
        const raw = area(label + '子模型', JSON.stringify(seed, null, 2), true),
          ref = select(label + '引用', ['#/$defs/Person', '#/$defs/Passport']);
        function sync() {
          raw.hidden = mode.selectedIndex !== 0;
          ref.hidden = mode.selectedIndex !== 1;
        }
        mode.onchange = sync;
        sync();
        return stack(mode, raw, ref);
      }
      function row(parent, key, name, control, widget, hint) {
        const r = el('section');
        r.className = 'property';
        const title = el('div', name);
        title.className = 'name';
        title.append(el('code', key));
        const spec = el('div');
        spec.className = 'spec';
        spec.append(el('strong', widget), hint);
        r.append(title, control, spec);
        parent.append(r);
      }
      function sections(parent) {
        const usual = el('div'),
          a = el('details'),
          advanced = el('div');
        a.append(el('summary', '高级属性'), advanced);
        parent.append(el('h3', '常用属性'), usual, a);
        return [usual, advanced];
      }
      const fields = [
        '行程类型 · trip',
        '护照号码 · passportNo',
        '身份证号 · identityNo',
        '单位名称 · company',
        '税号 · taxId',
      ];
      const pick = (l) => select(l, fields);
      function many(label, checked = []) {
        return group(...fields.map((s, i) => check(s, checked.includes(i))));
      }
      function jsonValue(label, type) {
        if (type === 'null') {
          const n = input(label, 'null');
          n.readOnly = true;
          return n;
        }
        if (type === 'boolean') return select(label, ['false', 'true']);
        if (type === 'array' || type === 'object')
          return area(label, type === 'array' ? '[]' : '{}', true);
        return type === 'integer' || type === 'number'
          ? num(label, '', type === 'integer' ? '1' : 'any')
          : input(label);
      }
      const literalSelectors = [];
      function literal(label, optional = false) {
        const type = select(
          label + '值类型',
          keys.map((k) => kinds[k]),
        );
        type.selectedIndex = keys.indexOf(fieldType.value);
        const set = check('设置' + label, !optional),
          box = el('div'),
          controls = stack(type, box),
          memo = new Map();
        function sync() {
          const k = keys[type.selectedIndex];
          if (!memo.has(k)) memo.set(k, jsonValue(label, k));
          box.replaceChildren(memo.get(k));
          controls.hidden = !set.firstChild.checked;
        }
        type.onchange = sync;
        set.onchange = sync;
        sync();
        if (optional)
          literalSelectors.push((k) => {
            type.selectedIndex = keys.indexOf(k);
            sync();
          });
        return stack(...(optional ? [set] : []), controls);
      }
      const [base, advanced] = sections(byId('common'));
      const fieldType = select('数据类型', keys);
      fieldType.replaceChildren(
        ...keys.map((k) => {
          const o = el('option', kinds[k]);
          o.value = k;
          return o;
        }),
      );
      fieldType.onchange = () => literalSelectors.forEach((fn) => fn(fieldType.value));
      row(
        base,
        'properties 的键',
        '字段标识',
        input('字段标识', 'passportNo'),
        '单行文本',
        '创建对象子字段时填写；重名就地提示，重命名应展示引用影响。',
      );
      row(
        base,
        'title',
        '显示名称',
        input('显示名称', '护照号码'),
        '单行文本',
        '支持中文；与字段标识分别维护。',
      );
      const members = group(...keys.map((k) => check(kinds[k], k === 'string' || k === 'null')));
      members.hidden = true;
      const multi = check('使用多类型');
      multi.onchange = () => {
        members.hidden = !multi.firstChild.checked;
        fieldType.hidden = !members.hidden;
      };
      row(
        base,
        'type',
        '数据类型',
        stack(group(fieldType, multi), members),
        '单选 / 类型多选',
        '常规字段单选。多类型逐项勾选，可含 null；混合类型的字面量另选实际值类型。',
      );
      row(
        base,
        'description',
        '字段说明',
        area('字段说明', '填写证件资料页上的号码。'),
        '多行文本',
        '允许换行，清空可移除说明。',
      );
      row(
        base,
        'required（父对象）',
        '始终必填',
        check('始终必填'),
        '复选框',
        '只对对象的具名子字段显示；勾选后把字段标识加入父对象 required。',
      );
      row(
        base,
        'default',
        '默认值',
        literal('默认值', true),
        '可选开关 + 类型对应输入框',
        '关闭表示未设置。开启后文本可为空串，整数用整数框，数值可带小数，布尔选 true / false，对象和数组用 JSON，null 显示固定值。',
      );
      row(
        base,
        'enum',
        '允许值',
        list('允许值', () => literal('允许值'), 0),
        '可增删的类型化值列表',
        '每项独立选择值类型。提示重复项；移除最后一项时撤掉限制。',
      );
      row(
        advanced,
        'const',
        '固定值',
        literal('固定值', true),
        '可选开关 + 单个类型化值',
        '区分明确指定 null 与未设置。',
      );
      row(
        advanced,
        'examples',
        '示例值',
        list('示例', () => literal('示例'), 0),
        '可增删的类型化值列表',
        '保留不同 JSON 类型；示例用于说明。',
      );
      row(advanced, '$comment', '维护注释', area('维护注释', ''), '多行文本', '供维护者阅读。');
      for (const [k, n] of [
        ['readOnly', '只读注解'],
        ['writeOnly', '只写注解'],
        ['deprecated', '废弃标记'],
      ])
        row(
          advanced,
          k,
          n,
          select(n, ['未设置', 'true', 'false']),
          '三态下拉',
          '分别表达省略、显式启用和显式关闭。',
        );
      const predicate = pick('条件字段'),
        op = select('条件运算', ['等于', '字段存在']),
        val = input('匹配值', '境外');
      op.onchange = () => (val.hidden = op.selectedIndex === 1);
      const rawIf = schema('完整条件', {
        required: ['trip'],
        properties: { trip: { const: '境外' } },
      });
      rawIf.hidden = true;
      const simple = group(predicate, op, val),
        kind = select('条件输入方式', ['按字段设置', '完整子模型']);
      kind.onchange = () => {
        simple.hidden = kind.selectedIndex === 1;
        rawIf.hidden = !simple.hidden;
      };
      row(
        advanced,
        'if',
        '条件',
        stack(kind, simple, rawIf),
        '字段选择器 + 比较方式 + 值',
        '按值匹配时同时声明字段存在。复杂条件可切换为完整子模型。',
      );
      function branch(key, name, field) {
        const picker = many('必填字段', [field]),
          custom = schema(name),
          choice = select(name + '内容', ['要求指定字段', '配置子模型']),
          set = check('设置' + name, true);
        const body = stack(choice, picker, custom);
        custom.hidden = true;
        choice.onchange = () => {
          picker.hidden = choice.selectedIndex === 1;
          custom.hidden = !picker.hidden;
        };
        set.onchange = () => (body.hidden = !set.firstChild.checked);
        row(
          advanced,
          key,
          name,
          stack(set, body),
          '可选分支 + 字段多选 / 子模型',
          '与同一位置的 if 配套；可分别省略两个分支。',
        );
      }
      branch('then', '条件成立时', 1);
      branch('else', '条件不成立时', 2);
      for (const [key, label, hint] of [
        ['allOf', '全部满足', '每个分支都需满足。'],
        ['anyOf', '至少满足一项', '允许同时匹配多个分支。'],
        ['oneOf', '恰好满足一项', '分支需要可区分。'],
      ])
        row(
          advanced,
          key,
          label,
          list('分支', () => schema(label), 1),
          '可增删的子模型列表',
          hint + '每个分支可使用本地引用或自定义模型。',
        );
      row(
        advanced,
        'not',
        '排除条件',
        schema('排除条件', { const: '停用' }),
        '单个子模型编辑器',
        '仅接受一个子模型。',
      );
      row(
        advanced,
        '$defs',
        '共享定义',
        list('定义', () => stack(input('定义名称', 'Passport'), schema('共享定义')), 1),
        '名称 + 子模型列表',
        '定义名在本层唯一；删除或改名时展示引用位置。',
      );
      row(
        advanced,
        '$ref',
        '引用目标',
        select('本地引用', ['未设置', '#/$defs/Passport', '#/$defs/Person']),
        '本地定义选择器',
        '选择后显示目标路径；已有复杂 URI 由原文编辑保留。',
      );
      for (const [k, n, v] of [
        ['$schema', '协议方言', 'https://json-schema.org/draft/2020-12/schema'],
        ['$id', '资源标识', 'https://example.org/travel'],
        ['$anchor', '静态锚点', 'passport'],
        ['$dynamicAnchor', '动态锚点', 'node'],
        ['$dynamicRef', '动态引用', '#node'],
      ])
        row(
          advanced,
          k,
          n,
          input(n, v),
          '单行标识 / URI 输入框',
          k === '$schema'
            ? '在 Schema 资源根选择或填写方言 URI。'
            : '保留原文；按该关键词的标识或引用格式提示。',
        );
      row(
        advanced,
        '$vocabulary',
        '元模式词汇',
        list('词汇', () => group(input('词汇 URI'), select('是否必需', ['必需', '可选'])), 0),
        'URI + 必需性列表',
        '仅在元模式资源根提供。',
      );
      row(
        advanced,
        'true / false（Schema）',
        '模型形式',
        select('模型形式', ['结构化模型', '允许任意实例 · true', '禁止任意实例 · false']),
        '模型形态单选',
        '选择布尔 Schema 时收起结构化属性；与 boolean 字段值分别处理。',
      );
      const tabsData = keys.map((k) => [k, kinds[k]]);
      for (const [k, name] of tabsData) {
        const panel = el('section');
        panel.id = k;
        panel.setAttribute('role', 'tabpanel');
        byId('panels').append(panel);
        const [basic, adv] = sections(panel);
        function r(where, key, n, c, w, h) {
          row(where, key, n, c, w, h);
        }
        const count = (where, key, label, v) =>
          r(
            where,
            key,
            label,
            num(label, v, '1', 0),
            '非负整数输入框',
            '留空表示未设置，0 为有效值。上下限同时填写时检查顺序。',
          );
        if (k === 'string') {
          count(basic, 'minLength', '最短长度', 6);
          count(basic, 'maxLength', '最长长度', 12);
          const regex = input('正则表达式', '^[A-Z0-9]+$'),
            templates = select('正则模板', ['选择模板', '大写字母和数字', '纯数字']);
          templates.onchange = () => {
            if (templates.selectedIndex)
              regex.value = templates.selectedIndex === 1 ? '^[A-Z0-9]+$' : '^[0-9]+$';
          };
          r(
            adv,
            'pattern',
            '正则匹配',
            stack(regex, templates, input('匹配样例', 'E12345678')),
            '正则文本框 + 模板 + 样例输入',
            '选模板后可继续手改；样例只用于试填。正式控件提供单条样例试跑。',
          );
          const f = input('格式名称', 'email');
          f.setAttribute('list', 'formats');
          const d = el('datalist');
          d.id = 'formats';
          for (const s of ['email', 'date', 'date-time', 'uri']) d.append(el('option', s));
          r(
            adv,
            'format',
            '格式名称',
            group(f, d),
            '可输入的候选框',
            '支持选择常见名称和填写自定义格式。',
          );
          for (const [key, n, v] of [
            ['contentEncoding', '内容编码', 'base64'],
            ['contentMediaType', '媒体类型', 'application/json'],
          ])
            r(adv, key, n, input(n, v), '可编辑文本框', '可填写标准名称；不读取或执行内容。');
          r(
            adv,
            'contentSchema',
            '内容模型',
            schema('内容模型'),
            '子模型编辑器',
            '与媒体类型配合描述解码后的内容。',
          );
        } else if (k === 'number' || k === 'integer') {
          const step = k === 'integer' ? '1' : 'any';
          for (const [n, l, ops] of [
            ['minimum / exclusiveMinimum', '下限', ['≥', '>']],
            ['maximum / exclusiveMaximum', '上限', ['≤', '<']],
          ])
            r(
              basic,
              n,
              l,
              group(select(l + '比较方式', ops), num(l, '', step)),
              '边界运算下拉 + 数字框',
              '比较方式决定写入哪个关键词。留空移除边界，保留显式 0。',
            );
          r(
            adv,
            'multipleOf',
            '必须为其倍数',
            num('倍数', '', 'any'),
            '正数输入框',
            '可用小数，值须大于 0；整数类型仍只接受整数实例。',
          );
        } else if (k === 'object') {
          r(
            basic,
            'properties',
            '子字段',
            list(
              '子字段',
              () => group(input('子字段标识', ''), select('子字段类型', Object.values(kinds))),
              1,
            ),
            '可增删的字段行',
            '每行一个标识和类型；选中字段后配置其详情。删除时提示受影响引用。',
          );
          r(
            basic,
            'required',
            '必填子字段',
            many('必填字段', [0]),
            '当前对象字段多选',
            '与子字段上的「始终必填」共用父对象声明。',
          );
          count(adv, 'minProperties', '最少属性数', '');
          count(adv, 'maxProperties', '最多属性数', '');
          r(
            adv,
            'dependentRequired',
            '存在时要求其他字段',
            list('依赖', () =>
              stack(
                tagged('当字段存在', pick('依赖来源')),
                tagged('同时必填', many('依赖目标', [1])),
              ),
            ),
            '来源字段单选 + 目标字段多选',
            '每个来源配置一组单向依赖；来源值为空串或 false 也算存在。',
          );
          r(
            adv,
            'dependentSchemas',
            '存在时应用子模型',
            list('依赖', () =>
              stack(pick('来源属性'), schema('依赖子模型', { required: ['taxId'] })),
            ),
            '来源字段单选 + 子模型编辑器',
            '触发后对子模型所属的整个对象应用约束。',
          );
          r(
            adv,
            'patternProperties',
            '按属性名匹配',
            list('模式', () => stack(input('属性名正则', '^ext_'), schema('匹配值模型'))),
            '正则 + 子模型列表',
            '每一行描述一组属性名及其值的模型。',
          );
          for (const [key, n] of [
            ['propertyNames', '属性名模型'],
            ['additionalProperties', '额外属性'],
            ['unevaluatedProperties', '未覆盖的属性'],
          ])
            r(
              adv,
              key,
              n,
              schema(n, key === 'propertyNames' ? { pattern: '^[a-z]' } : {}),
              '允许 / 禁止 / 引用 / 子模型',
              '按所选模式显示对应控件。',
            );
        } else if (k === 'array') {
          r(
            basic,
            'items',
            '元素模型',
            schema('元素模型', { type: 'object' }),
            '子模型编辑器',
            '可配置统一元素类型、引用或任意子模型。',
          );
          count(basic, 'minItems', '最少项数', 1);
          count(basic, 'maxItems', '最多项数', 5);
          r(
            adv,
            'uniqueItems',
            '元素唯一',
            select('元素唯一', ['未设置', 'true', 'false']),
            '三态下拉',
            '按完整元素判断是否重复。',
          );
          const enable = check('配置匹配条件'),
            c = schema('匹配条件', { type: 'integer', minimum: 18 });
          c.hidden = true;
          r(
            adv,
            'contains',
            '匹配条件',
            stack(enable, c),
            '开关 + 子模型编辑器',
            '启用后开放匹配数量。关闭时保留本次输入以便恢复。',
          );
          const bounds = [];
          for (const [key, n] of [
            ['minContains', '最少匹配项'],
            ['maxContains', '最多匹配项'],
          ]) {
            const i = num(n, '', '1', 0);
            i.disabled = true;
            bounds.push(i);
            r(adv, key, n, i, '非负整数输入框', '仅在 contains 启用时可填写。');
          }
          enable.onchange = () => {
            c.hidden = !enable.firstChild.checked;
            bounds.forEach((i) => (i.disabled = c.hidden));
          };
          r(
            adv,
            'prefixItems',
            '固定位置元素',
            list('位置', () => schema('位置模型'), 2, true),
            '可增删、排序的子模型列表',
            '从第一项开始按位置匹配，上移和下移会改变位置含义。',
          );
          r(
            adv,
            'unevaluatedItems',
            '未覆盖的元素',
            schema('剩余元素'),
            '允许 / 禁止 / 引用 / 子模型',
            '选择自定义模型后展开子模型输入。',
          );
        } else {
          basic.append(
            el(
              'p',
              k === 'boolean'
                ? '无专属常用属性。布尔值在共性属性「默认值」「固定值」中使用 true / false 单选。'
                : '无专属常用属性。选择 null 后，值控件固定显示 null。',
            ),
          );
          adv.append(el('p', '无专属高级属性。'));
        }
      }
      tabs(byId('types'), tabsData);
      tabs(byId('groups'), [
        ['common', '共性'],
        ['specific', '特有'],
      ]);
    </script>
  </body>
</html>
