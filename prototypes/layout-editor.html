<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>布局编辑 · 旅行保险投保单</title>
    <style>
      [hidden] {
        display: none !important;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f4f5f1;
        color: #24332e;
        font:
          14px/1.55 system-ui,
          'PingFang SC',
          sans-serif;
      }
      button,
      select,
      input {
        font: inherit;
        color: inherit;
      }
      button,
      select {
        cursor: pointer;
      }
      button,
      select,
      input {
        background: #fff;
        border: 1px solid #cdd6ce;
        border-radius: 6px;
        padding: 7px 12px;
      }
      button:hover,
      select:hover {
        border-color: #659582;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 3px solid #88b6a3;
        outline-offset: 1px;
      }
      .primary {
        background: #245b49;
        color: white;
        border-color: #245b49;
      }
      .quiet {
        background: transparent;
      }
      .subtle,
      small,
      .path {
        color: #5b6c63;
      }
      .path,
      code {
        font:
          12px/1.55 ui-monospace,
          monospace;
        overflow-wrap: anywhere;
      }
      .top,
      main {
        max-width: 1440px;
        margin: auto;
        padding: 0 clamp(12px, 3vw, 46px);
      }
      .top {
        padding-top: 24px;
        padding-bottom: 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 26px;
        letter-spacing: -1px;
      }
      .line,
      .tools {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 9px;
      }
      .line {
        justify-content: space-between;
      }
      .bar {
        background: #fff;
        border: 1px solid #ced8cf;
        border-radius: 10px 10px 0 0;
        padding: 13px 17px;
      }
      .bar label {
        font-weight: 650;
      }
      .bar select {
        margin-left: 7px;
        max-width: 150px;
      }
      .frame {
        display: grid;
        grid-template-columns: minmax(160px, 0.85fr) minmax(340px, 2.9fr) minmax(185px, 0.95fr);
        min-height: 610px;
        border: 1px solid #ced8cf;
        border-top: 0;
        border-radius: 0 0 10px 10px;
        overflow: hidden;
      }
      .side,
      .inspector {
        padding: 18px 12px;
        background: #fbfcf9;
        min-width: 0;
      }
      .side {
        border-right: 1px solid #d5ddd5;
      }
      .inspector {
        border-left: 1px solid #d5ddd5;
      }
      .eyebrow {
        font-size: 13px;
        font-weight: 650;
        color: #55675b;
        margin-bottom: 12px;
      }
      .tree {
        width: 100%;
        text-align: left;
        padding: 7px 9px;
        background: none;
        border: 1px solid transparent;
        overflow-wrap: anywhere;
      }
      .tree.child {
        padding-left: 28px;
        font-size: 13px;
      }
      .tree.current {
        background: #e4eee5;
        border-color: #c9daca;
        color: #24553e;
      }
      .canvas {
        padding: 18px clamp(12px, 2vw, 30px) 30px;
        min-width: 0;
        background-color: #edf0e9;
        background-image: radial-gradient(#ced6ca 0.8px, transparent 0.8px);
        background-size: 9px 9px;
      }
      .canvas > .line {
        margin-bottom: 14px;
      }
      .sheet {
        background: white;
        box-shadow: 0 3px 14px #314c3420;
        border: 1px solid #d2dad0;
        border-radius: 7px;
        overflow: hidden;
      }
      .paperhead {
        padding: 20px 22px 14px;
        border-top: 4px solid #486d59;
        border-bottom: 1px solid #e0e6de;
      }
      .paperhead h2 {
        font-size: 21px;
        font-weight: 650;
      }
      .block {
        margin: 10px;
        padding: 12px;
        border: 1px solid #d9e0d6;
        border-radius: 6px;
      }
      .block.selected {
        border-color: #579279;
      }
      .block h3 button {
        background: none;
        border: 0;
        padding: 0;
        font-weight: 650;
      }
      .controls {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
        margin: 9px 0;
      }
      .roomy .controls {
        grid-template-columns: 1fr;
        gap: 12px;
      }
      .roomy .block {
        padding: 18px;
        margin: 15px;
      }
      .control {
        text-align: left;
        min-width: 0;
        padding: 7px;
        border: 1px solid transparent;
        border-radius: 5px;
        background: transparent;
      }
      .control.selected {
        background: #eff6ef;
        border-color: #7ba58b;
      }
      .control strong {
        display: block;
        font-size: 13px;
        margin-bottom: 4px;
      }
      .mock {
        display: block;
        padding: 5px 8px;
        border: 1px solid #d4dcd4;
        background: #fbfcfa;
        border-radius: 4px;
        color: #6b766e;
        overflow-wrap: anywhere;
      }
      .add {
        padding: 4px 9px;
        border: 1px dashed #91a994;
        color: #305d42;
        background: #f9fbf7;
      }
      .inspector h2 {
        font-size: 18px;
        margin-bottom: 12px;
      }
      .field {
        display: grid;
        gap: 4px;
        margin: 12px 0;
      }
      .field > input,
      .field > select {
        width: 100%;
        min-width: 0;
      }
      .inspector hr {
        border: 0;
        border-top: 1px solid #dce2d9;
        margin: 16px 0;
      }
      .danger {
        color: #904336;
      }
      .status {
        min-height: 30px;
        padding: 6px 0;
      }
      .empty {
        margin: 14px 0;
        color: #617166;
      }
      .editorarea {
        padding: 12px 0;
      }
      .picker {
        background: #f5f9f3;
        border: 1px solid #81a68b;
        border-radius: 8px;
        padding: 13px;
        margin-top: 10px;
      }
      .picker h3 {
        font-size: 16px;
      }
      .choices {
        max-height: 180px;
        overflow: auto;
      }
      .choice {
        display: flex;
        gap: 9px;
        align-items: center;
        padding: 7px;
        border-bottom: 1px solid #dbe5db;
        cursor: pointer;
      }
      .choice input {
        width: auto;
      }
      .choice small {
        margin-left: auto;
      }
      .picker .tools {
        justify-content: flex-end;
        margin-top: 12px;
      }
      dialog {
        border: 1px solid #b5c8b9;
        border-radius: 12px;
        padding: 23px;
        width: min(440px, 94vw);
        color: inherit;
      }
      dialog::backdrop {
        background: #19332662;
      }
      dialog footer {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 19px;
      }
      .err {
        color: #944335;
      }
      .wide {
        width: min(720px, 95vw);
        max-height: 90vh;
        overflow: auto;
      }
      #previewBody {
        margin: 12px 0;
      }
      button:disabled {
        cursor: default;
        opacity: 0.55;
      }
      .mobilehead {
        display: none;
      }
      @media (max-width: 850px) {
        .frame {
          grid-template-columns: 155px minmax(0, 1fr);
        }
        .inspector {
          grid-column: 1/-1;
          border-left: 0;
          border-top: 1px solid #d5ddd5;
        }
        .inspector .field {
          max-width: 440px;
        }
      }
      @media (max-width: 590px) {
        .top {
          align-items: flex-start;
        }
        .top .tools {
          justify-content: flex-end;
        }
        .frame {
          display: flex;
          flex-direction: column;
        }
        .side {
          max-height: 155px;
          overflow: auto;
          border-bottom: 1px solid #d4dcd4;
        }
        .bar {
          gap: 10px;
        }
        .canvas {
          padding: 12px 8px;
        }
        .controls {
          grid-template-columns: 1fr;
        }
        .top h1 {
          font-size: 21px;
        }
        .top {
          padding-top: 15px;
        }
        .paperhead {
          padding: 13px;
        }
        .roomy .block {
          margin: 8px;
          padding: 12px;
        }
      }
      .material-cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(125px, 1fr));
        gap: 7px;
        margin: 10px 0;
      }
      .mat-card {
        text-align: left;
        padding: 8px;
        display: grid;
        gap: 4px;
        align-content: start;
      }
      .mat-card[aria-pressed='true'] {
        border: 2px solid #326c52;
        background: #ecf4ed;
      }
      .sample {
        display: block;
        border: 1px solid #cdd9ce;
        background: white;
        padding: 4px 6px;
        color: #66786a;
        border-radius: 4px;
        font-size: 12px;
      }
      .sample.button,
      .mock.button {
        background: #285740;
        color: white;
        text-align: center;
      }
      .mat-card small {
        font-size: 11px;
      }
      .inspector textarea {
        width: 100%;
        min-height: 78px;
        box-sizing: border-box;
      }
      .inspector h3 {
        font-size: 14px;
        overflow-wrap: anywhere;
      }
      .inspector label {
        overflow-wrap: anywhere;
      }
      .exprbox {
        font-size: 12px;
        margin: -6px 0 12px;
        color: #3c6652;
      }
      .exprbox summary {
        cursor: pointer;
      }
      .exprbox[open] {
        background: #edf5ee;
        padding: 8px;
        border-radius: 5px;
      }
      .exprbox button {
        margin: 5px 3px 0 0;
      }
      #findField {
        width: 100%;
        margin: 9px 0;
      }
      #fieldList {
        max-height: 55vh;
        overflow: auto;
      }
      .fieldItem {
        display: grid;
        grid-template-columns: 9px minmax(0, 1fr) auto;
        gap: 4px;
        align-items: center;
        min-height: 26px;
        font-size: 13px;
        line-height: 18px;
        width: 100%;
        text-align: left;
        padding: 2px 4px;
        border: 1px solid transparent;
        background: none;
        color: #5f6862;
        cursor: grab;
      }
      .fieldItem:hover {
        background: #eaf0e9;
      }
      .fieldItem:active {
        cursor: grabbing;
      }
      .fieldItem .mark {
        font-size: 11px;
        color: #768078;
      }
      .fieldItem.used {
        color: #234d3e;
      }
      .fieldItem.used .mark {
        color: #24724f;
      }
      .field-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .fieldItem small {
        white-space: nowrap;
        display: block;
        font-size: 11px;
      }
      .outline {
        margin: 14px 0;
        border-top: 1px solid #d0d9d1;
        padding-top: 12px;
      }
      .outline summary {
        cursor: pointer;
        font-weight: 650;
      }
      .dropzone {
        display: none;
      }
      .dragging .controls {
        display: flex;
        flex-direction: column;
        gap: 1px;
      }
      .dragging .dropzone {
        display: block;
        border: 1px dashed #98b39e;
        border-radius: 4px;
        padding: 3px;
        text-align: center;
        font-size: 11px;
        color: #3e634b;
      }
      .dragging .dropzone.over,
      .blank-drop.over {
        background: #daeede;
        outline: 2px solid #568468;
      }
      .blank-drop {
        padding: 24px;
        text-align: center;
      }
      .blank-drop p {
        margin-bottom: 12px;
      }
      #drawer {
        position: fixed;
        inset: 0 0 0 auto;
        margin: 0;
        width: min(470px, 96vw);
        height: 100dvh;
        max-width: none;
        max-height: none;
        padding: 0;
        border: 0;
        border-left: 1px solid #cad4c9;
        border-radius: 0;
        overflow: auto;
        overscroll-behavior: contain;
      }
      #drawer::backdrop {
        background: #19271c30;
      }
      .drawerhead {
        position: sticky;
        top: 0;
        z-index: 1;
        background: white;
        border-bottom: 1px solid #d8dfd6;
        padding: 16px;
      }
      .drawerhead h2 {
        font-size: 20px;
      }
      #drawer .picker {
        background: white;
        border: 0;
        margin: 0;
        padding: 16px;
      }
      #drawer .picker > .path {
        font-size: 13px;
        margin-bottom: 13px;
      }
      #drawer .tools {
        position: sticky;
        bottom: 0;
        background: white;
        border-top: 1px solid #d5ddd4;
        padding: 10px 0;
      }
      .drawerTarget {
        background: #f2f6ef;
        padding: 9px;
        border-radius: 5px;
        overflow-wrap: anywhere;
      }
      .side {
        max-height: none;
      }
      @media (max-width: 590px) {
        #fieldList {
          max-height: 160px;
        }
        .side {
          max-height: 320px;
        }
        .outline {
          margin: 5px 0;
        }
      }
      body[data-drag-scope='root'] .block[data-scope='insured'] .dropzone,
      body[data-drag-scope='insured'] .block[data-scope='root'] .dropzone {
        display: none;
      }
      body[data-drag-scope='root'] .block[data-scope='insured'],
      body[data-drag-scope='insured'] .block[data-scope='root'] {
        opacity: 0.55;
      }
      .data-branch {
        margin: 1px 0;
        padding-left: 6px;
        border-left: 1px solid #c7d7cd;
      }
      .data-branch summary {
        cursor: pointer;
        font-size: 13px;
        color: #385344;
        padding: 2px 0;
      }
      .shape,
      .option-row {
        padding: 6px 8px;
        border-left: 2px solid #cfdfd3;
        margin: 5px 0;
      }
      .binding-info {
        display: block;
        overflow-wrap: anywhere;
      }
      .option-rows {
        margin: 12px 0;
      }
      .control-visual {
        display: flex;
        align-items: center;
        gap: 5px;
        min-width: 0;
        font-size: 12px;
        font-weight: 400;
        font-style: normal;
        color: #42574a;
      }
      .vis-input {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 4px;
        background: white;
        border: 1px solid #b7c9bb;
        border-radius: 5px;
        padding: 6px;
        min-width: 0;
        flex: 1;
      }
      .vis-input > span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .vis-input b {
        color: #537565;
        white-space: nowrap;
      }
      .vis-button,
      .vis-check {
        background: #27634c;
        color: white;
        border-radius: 5px;
        padding: 5px 11px;
      }
      .vis-check {
        padding: 0 3px;
      }
      .control-visual i {
        font-style: normal;
      }
      .mat-card .control-visual {
        background: #f0f4ed;
        min-height: 64px;
        padding: 8px;
        border-radius: 5px;
      }
      .material-cards {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .placement-preview {
        border: 1px dashed #97b39e;
        border-radius: 7px;
        padding: 12px;
        display: grid;
        gap: 6px;
        margin: 8px 0;
      }
      .root-add {
        margin: 12px 12px 2px;
        color: #234f3c;
        border: 1px dashed #729782;
      }
      .controls > .block {
        min-width: 0;
        grid-column: 1/-1;
      }
      .block > .add {
        margin: 4px 4px 0 0;
      }
      .movable-control {
        display: flex;
        align-items: center;
        min-width: 0;
      }
      .movable-control > .control {
        flex: 1;
        min-width: 0;
      }
      .move-handle,
      .block h3 button.move-handle {
        color: #4d705c;
        border: 0;
        background: transparent;
        padding: 4px 6px;
        cursor: grab;
        font-size: 18px;
        line-height: 1;
      }
      .move-handle:active {
        cursor: grabbing;
      }
      .dragging .dropzone.move-only {
        display: none;
      }
      .moving-node .dropzone.move-only {
        display: block;
      }
      .moving-node .dropzone.blocked {
        display: none;
      }
      /* Workspace chrome follows a single text scale; the form keeps its own hierarchy. */
      :root {
        --ink: #202b35;
        --muted: #586977;
        --line: #d9dfe4;
        --accent: #205d60;
        --selected: #e8f2f1;
      }
      body {
        font:
          14px/1.55 -apple-system,
          BlinkMacSystemFont,
          'PingFang SC',
          'Microsoft YaHei',
          sans-serif;
        color: var(--ink);
        background: #f4f6f8;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        letter-spacing: normal;
      }
      button,
      select,
      input:not([type='checkbox']),
      textarea {
        border-color: var(--line);
        border-radius: 6px;
      }
      button {
        font-size: 14px;
        font-weight: 500;
        line-height: 20px;
      }
      .top,
      main {
        max-width: 1600px;
        padding-inline: clamp(12px, 2vw, 32px);
      }
      .top {
        padding-block: 20px;
      }
      .top h1 {
        font-size: 22px;
        line-height: 1.4;
        letter-spacing: -0.03em;
      }
      .top small,
      .context-line,
      .subtle,
      small,
      .path {
        color: var(--muted);
      }
      .top small,
      .context-line,
      .path,
      .fieldItem small {
        font-family: inherit;
        font-size: 12px;
        line-height: 1.5;
      }
      .primary {
        background: var(--accent);
        border-color: var(--accent);
      }
      .bar {
        border-color: var(--line);
        border-radius: 10px 10px 0 0;
        padding: 10px 16px;
      }
      .bar #create,
      .quiet,
      .back-link,
      .next-action {
        border-color: transparent;
        background: transparent;
      }
      .frame {
        border-color: var(--line);
        grid-template-columns: minmax(166px, 0.82fr) minmax(300px, 2.4fr) minmax(250px, 1fr);
        min-height: calc(100vh - 190px);
      }
      .side,
      .inspector {
        background: #fff;
        padding: 20px 16px;
        border-color: var(--line);
      }
      .rail-tabs {
        display: flex;
        gap: 8px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 14px;
      }
      .rail-tabs button {
        padding: 0 2px 9px;
        border: 0;
        border-radius: 0;
        background: transparent;
        color: var(--muted);
      }
      .rail-tabs button[aria-pressed='true'] {
        box-shadow: inset 0 -2px var(--accent);
        color: var(--ink);
        font-weight: 600;
      }
      .tree {
        font-size: 14px;
        line-height: 20px;
        margin-bottom: 2px;
      }
      .tree.current {
        background: var(--selected);
        border-color: transparent;
        color: var(--accent);
      }
      .canvas {
        background: #edf0f3;
        padding: 18px clamp(10px, 2vw, 28px) 32px;
      }
      .canvas > .line {
        margin-bottom: 14px;
      }
      .canvas > .line strong {
        font-size: 14px;
      }
      #arrange {
        padding: 2px 8px;
        background: transparent;
        font-size: 13px;
      }
      #arrange[aria-pressed='true'] {
        background: #fff;
      }
      .sheet {
        border: 1px solid #dbe1e4;
        border-radius: 8px;
        box-shadow: 0 3px 12px #20304409;
        padding-bottom: 14px;
      }
      .paperhead {
        border-top: 0;
        padding: 20px 24px 16px;
        border-bottom-color: #e6eaed;
      }
      .paperhead h2 {
        font-size: 22px;
        letter-spacing: -0.025em;
      }
      .block,
      .roomy .block {
        margin: 9px 12px;
        padding: 12px;
        border: 1px solid transparent;
        border-radius: 6px;
      }
      .block.selected {
        border-color: #72a29f;
        background: #f8fcfb;
      }
      .block h3,
      .inspector h3 {
        font-size: 14px;
        font-weight: 600;
        line-height: 22px;
      }
      .block .block {
        border-left: 2px solid #ccd8da;
        border-radius: 0;
        margin: 6px 0;
        padding: 8px 12px;
        background: #fafbfc;
      }
      .block .block.selected {
        background: var(--selected);
      }
      .control strong {
        font-size: 13px;
        font-weight: 500;
      }
      .vis-input,
      .mock {
        background: #fff;
        border-color: #ced6da;
      }
      .inspector h2 {
        font-size: 18px;
        margin: 3px 0 22px;
      }
      .inspector > h3,
      .trial-box h3 {
        margin: 16px 0 6px;
      }
      .scope-note {
        font-size: 14px;
        line-height: 1.7;
        margin: 0 0 14px;
      }
      .next-action,
      .back-link {
        display: block;
        color: var(--accent);
        padding-inline: 0;
      }
      .next-action {
        margin-top: 8px;
      }
      .back-link {
        margin-bottom: 16px;
      }
      .more-settings {
        margin-top: 18px;
        padding-top: 12px;
        border-top: 1px solid var(--line);
      }
      .more-settings summary {
        cursor: pointer;
        font-size: 14px;
      }
      .rule-summary {
        color: var(--accent);
        font-size: 12px;
      }

        if (cls) n.className = cls;
        return n;

      function button(text, action, cls) {
        const n = el('button', text, cls);
        n.type = 'button';
        n.onclick = action;
        return n;

        const o = el('option', text);
        o.value = value;
        select.append(o);

            el('h3', '放入第一个控件'),
            el('p', '从左侧点击或拖入字段，也可以先选择控件。'),
            button('选择第一个控件', () => startPick(group('表单内容', []), 0), 'primary'),
          );
          dropTarget(blank, null, 0);
          sheet.append(blank);
        }
        return sheet;
      }
      const samples = [
        { name: '林小禾', age: 16, guardianName: '林女士' },
        { name: '陈安', age: 28, guardianName: '' },
      ];
      const ops = {
        'core.lt': { label: '小于', test: (a, b) => a < b },
        'core.lte': { label: '小于或等于', test: (a, b) => a <= b },
        'core.gte': { label: '大于或等于', test: (a, b) => a >= b },
      };
      const parentOf = (node) => groups().find((g) => g.items.includes(node) || g.actions === node);
      function repeatAt(node) {
        for (let g = node; g; g = parentOf(g)) if (g.repeat) return g;
      }
      function refreshScope() {
        for (const g of groups()) g.scope = repeatAt(g) ? 'insured' : 'root';
      }
      function summary(rule) {
        const [left, right] = rule.$expr.args;
        return (
          (left.ref.scope ? '当前被保险人 › 年龄' : '整张表单 › 旅行天数') +
          ' ' +
          ops[rule.$expr.op].label +
          ' ' +
          right +
          (left.ref.scope ? ' 岁' : ' 天')
        );
      }
      function trial(rule, sample, days = 7) {
        const [left, limit] = rule.$expr.args;
        const number = left.ref.scope ? sample?.age : days;
        return Number.isFinite(number)
          ? { visible: ops[rule.$expr.op].test(number, limit) }
          : { visible: null };
      }
      function moveIssue(node, dest) {
        if (!sourceOf(node) || node.slot) return '这个节点不能独立移动。';
        if (!dest.g && !node.items) return '布局根层只接受容器。';
        if (node.items && [...containers([node])].includes(dest.g))
          return '不能将容器移入自身或后代。';
        const owner = repeatAt(parentOf(node)),
          target = repeatAt(dest.g);
        if (owner === target) return '';
        function dependency(n) {
          if (n.repeat) return target ? '目标位置已有被保险人重复区，嵌套会遮蔽当前成员。' : '';
          if (n.rule?.$expr.args[0].ref.scope) return '显示条件读取「当前被保险人 › 年龄」。';
          for (const k of Object.values(n.ports || {}))
            if (data(k)?.scope) return '控件绑定了「当前被保险人 › ' + data(k).label + '」。';
          function scoped(v) {
            return (
              v &&
              typeof v === 'object' &&
              !Object.hasOwn(v, '$literal') &&
              !Object.hasOwn(v, 'literal') &&
              ((v.source === 'data' && v.scope) || v.$scope || Object.values(v).some(scoped))
            );
          }
          if ([n.props, n.on, n.requests].some(scoped)) return '属性或交互引用了当前成员。';
          for (const c of [...(n.items || []), ...(n.actions ? [n.actions] : [])]) {
            const issue = dependency(c);
            if (issue) return issue;
          }
          return '';
        }
        const issue = dependency(node);
        return issue ? issue + '「' + (dest.g?.name || '布局根层') + '」无法保留此作用范围。' : '';
      }
      function foldedSettings(panel, c, g) {
        const more = el('details', undefined, 'more-settings');
        more.append(el('summary', '物料属性与绑定'));
        materialSettings(more, c, g);
        panel.append(more);
      }
      function travelInspector(panel, g) {
        const repeat = repeatAt(g),
          insured = g.id === layout().insuredId;
        const guardian = groups().find((n) => n.id === layout().guardianId);
        const go = (mode) => {
          page = mode;
          inspector();
        };
        function heading(title) {
          panel.replaceChildren(
            button('‹ 返回分区', () => go('settings'), 'back-link'),
            el('small', g.name, 'context-line'),
            el('h2', title),
          );
        }
        if (page === 'scope') {
          heading('设置数据范围');
          const mode = el('select');
          option(mode, 'each', '按成员重复');
          option(mode, 'single', '整张表单 · 单次显示');
          mode.value = 'each';
          const source = fieldPicker.input({
            label: '数据来源',
            available: fields.filter((f) => !f.scope && f.type === 'array'),
            value: 'insured',
            expected: '数组',
          });
          const info = el('p', undefined, 'scope-note');
          const seed = el('input');
          seed.type = 'checkbox';
          seed.checked = true;
          const add = el('label', undefined, 'seed-fields');
          add.append(seed, '同时加入示例字段（姓名、年龄、监护人姓名）');
          function update() {
            source.disabled = mode.value !== 'each';
            add.hidden = source.disabled || !!g.repeat;
            info.textContent = source.disabled
              ? '此分区使用整张表单的数据。'
              : '每条成员记录显示一份资料。分区内可读取当前被保险人，也可读取整张表单。';
          }
          mode.onchange = update;
          update();
          const err = el('p', undefined, 'move-error');
          err.setAttribute('role', 'alert');
          panel.append(
            fieldLabel('显示方式', mode),
            fieldLabel('数据来源', source),
            info,
            add,
            err,
            button(
              '应用范围',
              () => {
                if (mode.value === 'single' && g.repeat) {
                  const dependent = g.items.find(
                    (n) =>
                      moveIssue(n, { g: null }) &&
                      (n.items || Object.values(n.ports || {}).some((k) => data(k)?.scope)),
                  );
                  if (dependent) {
                    err.textContent =
                      '「' +
                      (dependent.name || dependent.label) +
                      '」仍读取当前成员。请先调整绑定或条件。';
                    return;
                  }
                }
                if (mode.value === 'each' && repeatAt(parentOf(g))) {
                  err.textContent = '此分区已处于被保险人重复区。';
                  return;
                }
                const first = !g.repeat;
                if (mode.value === 'each')
                  g.repeat = {
                    from: dataRef(data(source.value)),
                    as: 'insured',
                    mode: 'each',
                  };
                else delete g.repeat;
                refreshScope();
                if (first && g.repeat && seed.checked) {
                  g.items.unshift(control('name'), control('age'));
                  if (guardian && repeatAt(guardian) === g)
                    guardian.items.push(control('guardianName'));
                }
                touched();
                go('settings');
                render();
                notify('已更新「' + g.name + '」的数据范围。');
              },
              'primary',
            ),
          );
          return;
        }
        if (page === 'condition') {
          heading('编辑显示条件');
          const field = fieldPicker.input({
            label: '读取字段',
            available: fields.filter((f) => f.type === 'number' && (!f.scope || repeat)),
            scope: repeat ? 'insured' : 'root',
            value: g.rule
              ? g.rule.$expr.args[0].ref.scope
                ? 'age'
                : 'days'
              : repeat
                ? 'age'
                : 'days',
            expected: '数值',
          });
          const op = el('select');
          for (const [k, v] of Object.entries(ops)) option(op, k, v.label);
          const limit = el('input');
          limit.type = 'number';
          limit.step = 'any';
          limit.value = '18';
          if (g.rule) {
            const expr = g.rule.$expr;
            field.value = expr.args[0].ref.scope ? 'age' : 'days';
            op.value = expr.op;
            limit.value = expr.args[1];
          }
          const sample = el('input');
          sample.type = 'number';
          sample.step = 'any';
          const sampleLabel = fieldLabel('示例值', sample),
            result = el('output'),
            explanation = el('p', undefined, 'subtle');
          result.setAttribute('aria-live', 'polite');
          const evaluate = () => ({
            $expr: {
              op: op.value,
              args: [{ ref: dataRef(data(field.value)) }, limit.valueAsNumber],
            },
          });
          const apply = button(
            '应用条件',
            () => {
              g.rule = evaluate();
              touched();
              go('settings');
              render();
              notify('已应用「' + g.name + '」的显示条件。');
            },
            'primary',
          );
          function run() {
            const valid = Number.isFinite(limit.valueAsNumber);
            apply.disabled = !valid;
            const value = sample.valueAsNumber,
              outcome = valid ? trial(evaluate(), { age: value }, value).visible : null;
            result.textContent = !valid
              ? '请填写比较值'
              : outcome === null
                ? '缺少示例值'
                : outcome
                  ? '显示'
                  : '隐藏';
            result.className = outcome === true ? 'positive' : '';
            explanation.textContent =
              outcome === null
                ? '填写两个数值后即可试算。'
                : value +
                  ' ' +
                  ops[op.value].label +
                  ' ' +
                  limit.value +
                  '，条件' +
                  (outcome ? '成立。' : '不成立。');
          }
          function resetSample() {
            const label = field.value === 'age' ? '示例年龄（岁）' : '示例旅行天数';
            sampleLabel.firstChild.textContent = label;
            sample.setAttribute('aria-label', label);
            sample.value = field.value === 'age' ? 16 : 7;
            run();
          }
          field.onchange = resetSample;
          op.onchange = run;
          limit.oninput = run;
          sample.oninput = run;
          resetSample();
          const box = el('section', undefined, 'trial-box');
          box.append(el('h3', '试算'), sampleLabel, result, explanation);
          panel.append(
            fieldLabel('读取字段', field),
            fieldLabel('比较方式', op),
            fieldLabel('比较值', limit),
            box,
            apply,
          );
          return;
        }
        panel.replaceChildren(
          el('small', repeat ? '每位被保险人 · 分区设置' : '整张表单 · 分区设置', 'context-line'),
          el('h2', g.name),
        );
        if (insured) {
          panel.append(
            el('h3', '数据范围'),
            el('p', g.repeat ? '被保险人列表 › 每位成员' : '当前仅显示一次。', 'scope-note'),
            button(
              g.repeat ? '编辑数据范围' : '设置重复区',
              () => go('scope'),
              g.repeat ? 'quiet' : 'primary',
            ),
          );
          if (g.repeat && guardian)
            panel.append(
              button(
                '编辑监护人显示条件',
                () => {
                  selectNode(guardian.id);
                  go('condition');
                },
                'next-action',
              ),
            );
        } else {
          panel.append(
            el('h3', '显示条件'),
            el('p', g.rule ? summary(g.rule) : '始终显示', 'scope-note'),
            button('编辑显示条件', () => go('condition'), 'primary'),
            button('移动分区', () => moveByChoice(g), 'next-action'),
          );
        }
        foldedSettings(panel, g, g);
        const actions = el('details', undefined, 'more-settings');
        actions.append(
          el('summary', '编排分区'),
          button('添加控件', () => startPick(g, g.items.length)),
          button('嵌套布局', () => layoutPalette(g)),
        );
        panel.append(actions);
      }
      function inspector() {
        const panel = $('inspector');
        panel.replaceChildren(
          el('div', layout().name + ' / ' + (current().g?.name || '根容器'), 'path'),
        );
        const { g, c } = current();
        if (layout().travel && !c && g && !pending && !g.slot) {
          travelInspector(panel, g);
          return;
        }
        panel.append(el('h2', c ? '控件设置' : g ? '容器设置' : '布局设置'));
        if (pending?.layoutOnly) return;
        if (pending) {
          panel.append(el('p', '正在为「' + pending.g.name + '」选择控件。', 'subtle'));
          return;
        }
        if (c) {
          const title = el('input');
          title.value = c.label;
          title.onchange = () => {
            const v = title.value.trim();
            if (!v) {
              title.value = c.label;
              return;
            }
            c.label = v;
            touched();
            renderTree();
            $('sheet').replaceChildren(paper(layout()));
          };
          panel.append(fieldLabel('控件标题', title));
          foldedSettings(panel, c, g);
          panel.append(
            el('hr'),
            button(
              '从此布局移除',
              () => {
                g.items.splice(g.items.indexOf(c), 1);
                selection.set(active, g.id);
                touched();
                render();
                notify('已从「' + layout().name + '」移除控件，数据字段仍可添加。');
              },
              'danger',
            ),
          );
          return;
        }
        if (g) {
          panel.append(
            el('h3', g.name),
            el(
              'p',
              g.slot
                ? '分区的操作插槽'
                : g.scope === 'insured'
                  ? '重复区域 · 每位被保险人'
                  : '布局容器',
              'subtle',
            ),
          );
          if (!g.slot) {
            g.material ??= 'section';
            g.props ??= { title: g.name };
            foldedSettings(panel, g, g);
          }
          panel.append(
            el('hr'),
            button('在此选择控件', () => startPick(g, g.items.length)),
            button('＋ 嵌套布局', () => layoutPalette(g)),
          );
          return;
        }
        const d = el('select');
        option(d, 'compact', '紧凑双列');
        option(d, 'roomy', '宽松单列');
        d.value = layout().density;
        d.onchange = () => {
          layout().density = d.value;
          touched();
          render();
        };
        const name = el('input');
        name.value = layout().name;
        name.onchange = () => {
          if (
            !name.value.trim() ||
            all.some((l) => l.key !== active && l.name === name.value.trim())
          ) {
            name.value = layout().name;
            notify('请填写唯一名称');
            return;
          }
          layout().name = name.value.trim();
          touched();
          render();
        };
        panel.append(
          fieldLabel('布局名称', name),
          el('code', '存储 key · ' + active),
          fieldLabel('画布排布', d),
        );
        panel.append(button('选择外层布局控件', () => layoutPalette(), 'primary'));
      }
      function render() {
        const s = $('layouts');
        s.replaceChildren();
        for (const l of all) option(s, l.key, l.name);
        s.value = active;
        $('canvasName').textContent = layout().name;
        $('sheet').replaceChildren(paper(layout()));
        renderTree();
        fieldCoverage();
        inspector();
        state();
        $('save').disabled = !!pending;
        $('create').disabled = !!pending;
        $('preview').disabled = !!pending;
      }
      $('layouts').onchange = (e) => {
        if (pending) {
          e.target.value = active;
          notify('请先完成或取消控件添加，再切换布局。');
          return;
        }
        page = 'settings';
        active = e.target.value;
        notify('');
        render();
      };
      $('create').onclick = () => {
        $('newName').value = '';
        $('newKey').value = '';
        $('error').textContent = '';
        $('start').value = 'copy';
        $('sourceLabel').hidden = false;
        $('source').replaceChildren();
        for (const l of all) option($('source'), l.key, l.name);
        $('source').value = active;
        $('newLayout').showModal();
        $('newName').focus();
      };
      $('start').onchange = () => ($('sourceLabel').hidden = $('start').value !== 'copy');
      $('cancel').onclick = () => $('newLayout').close();
      $('createForm').onsubmit = (e) => {
        e.preventDefault();
        const name = $('newName').value.trim();
        if (!name || all.some((l) => l.name === name)) {
          $('error').textContent = '请填写唯一的布局名称。';
          return;
        }
        const l =
          $('start').value === 'copy'
            ? structuredClone(all.find((l) => l.key === $('source').value))
            : { groups: [], density: 'roomy' };
        const key = $('newKey').value.trim();
        if (!key || all.some((l) => l.key === key)) {
          $('error').textContent = '请填写唯一的布局 key。';
          return;
        }
        l.key = key;
        l.name = name;
        for (const g of containers(l.groups)) {
          const previousId = g.id;
          g.id = id();
          if (l.insuredId === previousId) l.insuredId = g.id;
          if (l.guardianId === previousId) l.guardianId = g.id;
          for (const c of g.items) if (!c.items) c.id = id();
        }
        all.push(l);
        active = key;
        pending = null;
        touched();
        $('newLayout').close();
        render();
        notify('已创建并进入「' + name + '」。');
      };
      $('save').onclick = () => {
        const invalid = $('inspector').querySelector(':invalid');
        if (invalid) {
          invalid.reportValidity();
          notify('请先修正当前输入，再保存草稿。');
          return;
        }
        try {
          localStorage.setItem(
            storeKey,
            JSON.stringify({
              version: 2,
              views: Object.fromEntries(all.map(({ key, ...body }) => [key, body])),
              active,
            }),
          );
          dirty = false;
          state();
          notify('全部布局已保存到当前浏览器。');
        } catch {
          notify('当前浏览器未能保存，修改仍在本页。');
        }
      };
      $('preview').onclick = () => {
        $('previewTitle').textContent = '布局预览 · ' + layout().name;
        $('previewBody').replaceChildren(paper(layout(), true));
        $('previewDialog').showModal();
      };
      $('closePreview').onclick = () => $('previewDialog').close();
      render();
    </script>
  </body>
</html>
