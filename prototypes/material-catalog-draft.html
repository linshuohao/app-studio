<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>物料目录 · Studio 草案</title>
    <link rel="stylesheet" href="../apps/studio/src/app/studio-ui.css" />
    <style>
      html {
        font-size: 13px;
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      body {
        margin: 0;
        background: var(--studio-surface);
        color: var(--studio-text);
        font: var(--studio-type-body);
      }
      h1,
      h2,
      p,
      dl,
      dd,
      ul {
        margin: 0;
      }
      h1 {
        font: var(--studio-type-title);
      }
      h2 {
        font: var(--studio-type-section);
      }
      small,
      .meta {
        color: var(--studio-text-muted);
        font: var(--studio-type-caption);
      }
      code {
        font: var(--studio-type-code);
      }
      button {
        cursor: pointer;
      }
      select {
        font: var(--studio-type-control);
        color: inherit;
      }
      .top {
        display: flex;
        align-items: center;
        gap: var(--studio-space-8);
        min-height: 48px;
        padding: var(--studio-space-8) var(--studio-space-24);
        border-bottom: 1px solid var(--studio-border);
        font: var(--studio-type-control);
      }
      .top .meta:first-child {
        font: inherit;
      }
      main {
        display: grid;
        gap: var(--studio-space-24);
        padding: var(--studio-space-24);
      }
      .page-title {
        display: grid;
        gap: var(--studio-space-4);
      }
      .page-title p {
        color: var(--studio-text-muted);
      }
      .results,
      .box {
        border: 1px solid var(--studio-border);
        border-radius: var(--studio-radius-12);
      }
      .studio-list-filters select {
        min-height: var(--studio-control-height);
        padding-inline: var(--studio-space-8);
        background: var(--studio-surface);
        border: 1px solid var(--studio-control-border);
        border-radius: var(--studio-radius-8);
      }
      :is(button, a, select, input):focus-visible {
        outline: 2px solid var(--studio-focus-ring);
        outline-offset: 2px;
      }
      .studio-card-list {
        list-style: none;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 288px), 1fr));
        gap: var(--studio-space-16);
        padding: var(--studio-space-16);
      }
      .material-card {
        display: grid;
        grid-template-rows: 144px auto 1fr auto;
        height: 100%;
        border: 1px solid var(--studio-border);
        border-radius: var(--studio-radius-8);
        overflow: hidden;
      }
      .material-card:focus-within,
      .material-card:hover {
        border-color: var(--studio-control-border);
      }
      .tile-preview {
        display: grid;
        place-items: center;
        padding: var(--studio-space-16);
        background: var(--studio-bg);
        border-bottom: 1px solid var(--studio-border);
      }
      .sample {
        width: min(100%, 270px);
        display: grid;
        gap: var(--studio-space-8);
      }
      .sample label {
        display: grid;
        gap: var(--studio-space-4);
      }
      .sample :is(input:not([type='checkbox']), select) {
        width: 100%;
        min-width: 0;
      }
      .sample .pair {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: var(--studio-space-8);
      }
      .sample .check {
        display: flex;
        align-items: center;
      }
      .sample .scene-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--studio-space-8);
      }
      .sample .scene-row + .scene-row {
        border-top: 1px solid var(--studio-border);
        padding-top: var(--studio-space-8);
      }
      .sample button {
        justify-self: start;
      }
      .card-heading,
      .card-actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--studio-space-8);
      }
      .material-card > :is(.card-heading, p, footer) {
        padding-inline: var(--studio-space-12);
      }
      .card-heading {
        padding-top: var(--studio-space-12);
      }
      .material-card > p {
        padding-block: var(--studio-space-4) var(--studio-space-12);
        color: var(--studio-text-muted);
      }
      .card-actions {
        padding-bottom: var(--studio-space-12);
      }
      .card-actions button {
        white-space: nowrap;
      }
      .result-footer {
        padding: var(--studio-space-12) var(--studio-space-16);
        border-top: 1px solid var(--studio-border);
      }
      .empty {
        padding: var(--studio-space-32) var(--studio-space-16);
      }
      .detail-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: var(--studio-space-16);
      }
      .box {
        display: grid;
        grid-auto-rows: max-content;
        gap: var(--studio-space-16);
        padding: var(--studio-space-16);
      }
      .detail-preview {
        display: grid;
        place-items: center;
        min-height: 168px;
        background: var(--studio-bg);
        border-radius: var(--studio-radius-8);
        padding: var(--studio-space-16);
      }
      .contract > div {
        display: grid;
        grid-template-columns: minmax(96px, 1fr) 2fr;
        gap: var(--studio-space-8);
        padding-block: var(--studio-space-8);
      }
      .contract > div + div {
        border-top: 1px solid var(--studio-border);
      }
      .back {
        justify-self: start;
      }
      @media (max-width: 800px) {
        .top,
        main {
          padding-inline: var(--studio-space-16);
        }
        .detail-grid {
          grid-template-columns: minmax(0, 1fr);
        }
        .studio-list-filters > input {
          flex-basis: 100%;
          max-width: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="top">
      <span class="meta">默认空间</span><span class="meta" aria-hidden="true">/</span
      ><span>物料</span>
    </header>
    <main id="catalog">
      <header class="page-title">
        <h1>物料目录</h1>
        <p>查找 Web 表单可用的物料，查看效果和版本信息。</p>
      </header>
      <section class="results" aria-label="物料搜索结果">
        <form class="studio-list-filters" aria-label="物料筛选">
          <input
            class="studio-input"
            id="query"
            type="search"
            aria-label="搜索物料"
            placeholder="搜索名称、标识或说明"
          />
          <select id="category" aria-label="用途分类">
            <option value="">全部分类</option>
            <option>输入</option>
            <option>布局</option>
            <option>交互</option>
            <option>容器</option>
          </select>
          <select id="technology" aria-label="实现技术">
            <option value="">全部技术</option>
            <option>React</option>
          </select>
          <button class="studio-button" data-variant="secondary" id="clear" type="button" disabled>
            清除筛选
          </button>
        </form>
        <ul class="studio-card-list" id="cards" aria-label="物料列表"></ul>
        <p class="empty" id="empty" hidden>没有匹配的物料，请调整关键词或筛选条件。</p>
        <footer class="result-footer"><output class="meta" id="count"></output></footer>
      </section>
    </main>
    <main id="detail" hidden>
      <button class="studio-button back" data-variant="secondary" type="button" id="back">
        返回物料目录
      </button>
      <header class="page-title">
        <h1 tabindex="-1" id="detail-title"></h1>
        <p id="detail-summary"></p>
      </header>
      <div class="detail-grid">
        <section class="box">
          <div class="card-heading">
            <h2>效果预览</h2>
            <button class="studio-button" data-variant="secondary" type="button" id="reset">
              重置示例
            </button>
          </div>
          <div class="detail-preview" id="demo"></div>
        </section>
        <section class="box">
          <h2>资产信息</h2>
          <dl class="contract" id="contract"></dl>
        </section>
      </div>
    </main>
    <script>
      const input = (type, value, label) =>
        '<label><small>' +
        label +
        '</small><input class="studio-input" type="' +
        type +
        '" value="' +
        value +
        '"></label>';
      const choice = (label, options) =>
        '<label><small>' +
        label +
        '</small><select class="studio-input">' +
        options.map((option) => '<option>' + option + '</option>').join('') +
        '</select></label>';
      const action = (label, variant = 'secondary') =>
        '<button type="button" class="studio-button" data-variant="' +
        variant +
        '">' +
        label +
        '</button>';

      const items = [
        [
          'date-range',
          '日期范围',
          '输入',
          '成对采集开始与结束日期。',
          '<div class="pair">' +
            input('date', '2026-12-01', '开始') +
            input('date', '2026-12-05', '结束') +
            '</div>',
        ],
        [
          'remote-select',
          '远程搜索',
          '输入',
          '按关键词从宿主提供的数据中搜索并选择。',
          '<label><small>目的地城市</small><input class="studio-input" placeholder="搜索城市"></label>',
        ],
        [
          'array-editor',
          '对象数组编辑器',
          '容器',
          '维护可重复的对象条目，适用于同行人等场景。',
          '<div class="scene-row"><strong>同行人</strong></div><div class="scene-row"><span>林小满</span></div>' +
            input('text', '', '新增同行人'),
        ],
        [
          'text-input',
          '文本输入',
          '输入',
          '采集姓名、编号或其他短文本。',
          input('text', '林小满', '联系人姓名'),
        ],
        [
          'select',
          '固定选项',
          '输入',
          '从已配置的选项中选择一项。',
          choice('出行类型', ['个人出行', '家庭出行', '团队出行']),
        ],
        [
          'grid',
          '响应式网格',
          '布局',
          '让多个表单项按列排列并随空间变化。',
          '<div class="pair">' +
            input('text', '林小满', '姓名') +
            input('number', '2', '人数') +
            '</div>',
        ],
        [
          'number-input',
          '数字输入',
          '输入',
          '采集人数、数量或金额等数值。',
          input('number', '2', '出行人数'),
        ],
        [
          'checkbox',
          '勾选',
          '输入',
          '采集同意确认或布尔值。',
          '<label class="check"><input type="checkbox">我已阅读并同意相关条款</label>',
        ],
        ['button', '操作按钮', '交互', '触发由表单配置定义的动作。', action('保存草稿', 'primary')],
      ].map(([id, name, category, summary, sample]) => ({
        id,
        name,
        category,
        summary,
        sample,
        version: '0.1.0',
        technology: 'React',
      }));

      const $ = (id) => document.getElementById(id);
      const query = $('query'),
        category = $('category'),
        technology = $('technology'),
        clear = $('clear');
      let opened,
        source,
        position = 0;

      function render() {
        const term = query.value.trim().toLowerCase();
        const results = items.filter(
          (item) =>
            [item.name, item.id, item.summary].some((value) =>
              value.toLowerCase().includes(term),
            ) &&
            (!category.value || category.value === item.category) &&
            (!technology.value || technology.value === item.technology),
        );
        clear.disabled = !(query.value || category.value || technology.value);
        $('empty').hidden = !!results.length;
        $('cards').hidden = !results.length;
        $('count').textContent = '共 ' + results.length + ' 项';
        $('cards').innerHTML = results
          .map(
            (item) =>
              '<li><article class="material-card"><div class="tile-preview" inert aria-hidden="true"><div class="sample">' +
              item.sample +
              '</div></div><header class="card-heading"><h2>' +
              item.name +
              '</h2><small>v' +
              item.version +
              '</small></header><p>' +
              item.summary +
              '</p><footer class="card-actions"><small>' +
              item.category +
              ' · ' +
              item.technology +
              '</small><button class="studio-button" data-variant="secondary" type="button" data-id="' +
              item.id +
              '" aria-label="查看' +
              item.name +
              '详情">查看详情</button></footer></article>',
          )
          .join('');
      }
      function resetDemo() {
        $('demo').innerHTML = '<div class="sample">' + opened.sample + '</div>';
        if (opened.id === 'remote-select') {
          const search = $('demo').querySelector('input');
          search.setAttribute('list', 'demo-cities');
          search.insertAdjacentHTML(
            'afterend',
            '<datalist id="demo-cities"><option>东京</option><option>大阪</option><option>京都</option></datalist>',
          );
        }
        if (opened.id === 'button') {
          const previewButton = $('demo').querySelector('button');
          previewButton.insertAdjacentHTML('afterend', '<output class="meta"></output>');
          previewButton.addEventListener(
            'click',
            () => ($('demo').querySelector('output').textContent = '已触发示例动作'),
          );
        }
      }
      function show(item) {
        opened = item;
        $('catalog').hidden = !!item;
        $('detail').hidden = !item;
        if (!item) {
          source?.focus({ preventScroll: true });
          window.scrollTo(0, position);
          return;
        }
        $('detail-title').textContent = item.name;
        $('detail-summary').textContent = item.summary;
        $('contract').innerHTML = [
          ['物料标识', item.id],
          ['版本', item.version],
          ['用途分类', item.category],
          ['实现技术', item.technology],
        ]
          .map(([label, value]) => '<div><dt>' + label + '</dt><dd>' + value + '</dd></div>')
          .join('');
        resetDemo();
        window.scrollTo(0, 0);
        $('detail-title').focus({ preventScroll: true });
      }
      $('cards').addEventListener('click', (event) => {
        const button = event.target.closest('[data-id]');
        if (!button) return;
        source = button;
        position = window.scrollY;
        show(items.find((item) => item.id === button.dataset.id));
      });
      $('back').addEventListener('click', () => show());
      $('reset').addEventListener('click', resetDemo);
      query.addEventListener('input', render);
      category.addEventListener('change', render);
      technology.addEventListener('change', render);
      clear.addEventListener('click', () => {
        query.value = category.value = technology.value = '';
        render();
        query.focus();
      });
      document.querySelector('form').addEventListener('submit', (event) => event.preventDefault());
      render();
    </script>
  </body>
</html>
