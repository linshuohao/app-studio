<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>家庭出行 · 添加联动动作</title>
  <style>
    :root {
      font:
        14px/1.5 Inter,
        -apple-system,
        BlinkMacSystemFont,
        'PingFang SC',
        sans-serif;
      background: #f4f6f8;
      color: #293542;
      --border: #dbe2e9;
      --muted: #596879;
      --accent: #35577b;
      --wash: #edf3f9;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
    }
    main {
      max-width: 1200px;
      margin: auto;
      padding: 24px clamp(14px, 3vw, 42px);
    }
    h1,
    h2,
    h3,
    p {
      margin: 0;
    }
    h1 {
      font-size: 1.45rem;
    }
    h2 {
      font-size: 1.05rem;
    }
    h3 {
      font-size: 0.88rem;
    }
    small,
    .muted {
      color: var(--muted);
    }
    button,
    input,
    select,
    textarea {
      font: inherit;
    }
    button,
    select,
    input,
    textarea {
      border: 1px solid #c9d3df;
      border-radius: 6px;
      background: white;
      color: inherit;
      padding: 0.42rem 0.64rem;
    }
    button {
      cursor: pointer;
    }
    button:hover:not(:disabled) {
      background: var(--wash);
    }
    button:disabled {
      opacity: 0.47;
      cursor: default;
    }
    :focus-visible {
      outline: 2px solid #567da3;
      outline-offset: 2px;
    }
    .primary {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    .primary:hover:not(:disabled) {
      background: #294b71;
    }
    .shell,
    .panel {
      border: 1px solid var(--border);
      background: white;
      border-radius: 9px;
      min-width: 0;
    }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 0 16px;
    }
    .context {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      padding: 12px 15px;
      border-bottom: 1px solid var(--border);
      font-size: 0.88rem;
    }
    .pill {
      background: var(--wash);
      color: var(--accent);
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
    }
    code,
    pre {
      font-family: ui-monospace, monospace;
    }
    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
      gap: 14px;
      padding: 14px;
    }
    .panel {
      padding: 14px;
    }
    .heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 11px;
    }
    .list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 5px;
    }
    .list li {
      display: flex;
      gap: 8px;
      align-items: baseline;
      justify-content: space-between;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.55rem 0.65rem;
    }
    .list li > div:first-child {
      min-width: 0;
      overflow-wrap: anywhere;
    }
    .order {
      color: var(--muted);
      margin-right: 0.4rem;
    }
    .tools {
      white-space: nowrap;
    }
    .tools button {
      padding: 0.12rem 0.38rem;
    }
    .empty {
      padding: 0.85rem 0;
      color: var(--muted);
    }
    .builder {
      border-top: 1px solid var(--border);
      padding-top: 12px;
      margin-top: 12px;
    }
    .group {
      display: grid;
      gap: 5px;
      margin: 0.7rem 0;
    }
    .group h3 {
      color: var(--muted);
      font-weight: 600;
    }
    .choices {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 5px;
    }
    .choices button {
      text-align: left;
    }
    .choices button span,
    .choices button small {
      display: block;
    }
    .choices button small {
      margin-top: 2px;
      font-size: 0.82rem;
    }
    .form-fields {
      display: grid;
      gap: 9px;
      margin: 0.7rem 0;
    }
    .form-fields label {
      display: grid;
      gap: 3px;
      font-weight: 550;
    }
    .form-fields :is(input, textarea, select) {
      width: 100%;
      min-width: 0;
    }
    .form-fields textarea {
      min-height: 5rem;
      font:
        12px/1.5 ui-monospace,
        monospace;
    }
    .params {
      border: 1px solid var(--border);
      background: #f5f8fb;
      padding: 8px;
      border-radius: 6px;
      display: grid;
      gap: 7px;
    }
    .foot {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
    }
    .sample {
      margin-top: 12px;
    }
    .sample label {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    pre {
      margin: 0.55rem 0;
      background: #f5f7fa;
      border-radius: 5px;
      padding: 0.7rem;
      font-size: 0.82rem;
      max-height: 340px;
      overflow: auto;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      color: #27415c;
    }
    .error {
      color: #a12c22;
    }
    .results {
      display: grid;
      gap: 8px;
      padding-top: 12px;
      margin-top: 12px;
      border-top: 1px solid var(--border);
    }
    .grid {
      grid-template-columns: minmax(175px, 0.8fr) minmax(0, 2.9fr);
      align-items: start;
    }
    .heading-title {
      display: grid;
      gap: 0.15rem;
    }
    .action-rail {
      display: grid;
      align-content: start;
      gap: 0.4rem;
    }
    .action-rail .heading {
      margin-bottom: 0.35rem;
      flex-wrap: wrap;
    }
    .action-rail #add {
      width: 100%;
      margin-block-end: 0.45rem;
    }
    .action-tabs {
      display: grid;
      gap: 0.35rem;
    }
    .action-tabs [role='tab'] {
      display: grid;
      grid-template-columns: 1.45rem 1fr;
      gap: 0.5rem;
      align-items: start;
      text-align: start;
      width: 100%;
      min-width: 0;
    }
    .action-tabs [aria-selected='true'] {
      background: var(--wash);
      border-color: #9ab1c7;
      color: #244767;
    }
    .action-tabs .tab-detail {
      display: block;
      overflow-wrap: anywhere;
      font-size: 0.78rem;
    }
    .action-tabs .tab-index {
      text-align: center;
      border-radius: 4px;
      color: var(--muted);
      background: #e8edf2;
    }
    .workspace-panel {
      padding: 0;
      overflow: hidden;
    }
    .configuration,
    .protocol,
    .sample {
      padding: 14px 16px;
    }
    .workspace-panel > * + * {
      border-top: 1px solid var(--border);
    }
    .configuration .heading {
      align-items: start;
    }
    .configuration .heading .muted {
      margin-block-start: 0.1rem;
    }
    .configuration .form-fields {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-items: start;
      padding-bottom: 0.2rem;
      gap: 0.85rem;
    }
    .configuration .form-fields > :is(#value-editor, .full-field) {
      grid-column: 1 / -1;
    }
    .configuration .form-fields > label span {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.35rem;
    }
    .configuration .form-fields label small {
      font-weight: 400;
      margin-block-start: 0.08rem;
    }
    .configuration .foot {
      align-items: center;
      gap: 0.65rem;
    }
    .configuration .foot .muted {
      margin-inline-end: auto;
    }
    .configuration .heading .tools button {
      padding: 0.24rem 0.45rem;
    }
    .protocol .heading {
      margin-bottom: 0.45rem;
    }
    .protocol .tools [aria-pressed='true'] {
      color: var(--accent);
      background: var(--wash);
      border-color: #adbed0;
    }
    .workspace-panel .sample {
      margin: 0;
    }
    .sample .heading {
      flex-wrap: wrap;
    }
    .choice-drawer {
      position: fixed;
      inset: 0 auto 0 0;
      margin: 0;
      border: 0;
      border-right: 1px solid var(--border);
      width: min(390px, 100vw);
      max-width: 100vw;
      max-height: 100dvh;
      height: 100dvh;
      padding: 18px;
      color: inherit;
      box-shadow: 6px 0 30px #21334827;
    }
    .choice-drawer::backdrop {
      background: #26394d45;
    }
    .choice-drawer .choices {
      grid-template-columns: 1fr;
    }
    .choice-drawer .choices button {
      border-color: var(--border);
      padding: 0.5rem 0.65rem;
    }
    .choice-drawer .group {
      margin-block: 0.9rem;
    }
    .choice-drawer .group h3 {
      color: var(--accent);
    }
    [hidden] {
      display: none !important;
    }
    @media (max-width: 760px) {
      .grid {
        grid-template-columns: 1fr;
      }
      .top {
        align-items: flex-start;
      }
      .configuration .form-fields {
        grid-template-columns: 1fr;
      }
    }
  </style>
  <main>
    <header class="top">
      <div>
        <small>家庭出行 / 配置 / 联动</small>
        <h1>编排有序动作</h1>
      </div>
      <span class="pill">交互原型</span>
    </header>
    <div class="shell">
      <div class="context">
        <strong>逐人保费与通知</strong><span class="pill">每位被保人 · insured</span
        ><code>观察当前成员年龄</code>
      </div>
      <div class="grid">
        <section class="panel action-rail" aria-label="动作编排">
          <div class="heading">
            <h2>有序动作</h2>
            <small id="count"></small>
          </div>
          <button class="primary" id="add" type="button" aria-haspopup="dialog">＋ 添加动作</button>
          <div
            class="action-tabs"
            id="actions"
            role="tablist"
            aria-label="有序动作"
            aria-orientation="vertical"
          ></div>
          <p class="empty" id="empty">尚未添加动作。</p>
        </section>
        <div class="panel workspace-panel">
          <section class="configuration" id="builder" role="tabpanel" hidden>
            <div class="heading">
              <div class="heading-title">
                <h2 id="builder-title"></h2>
                <p id="action-description" class="muted"></p>
              </div>
              <div class="tools" aria-label="调整动作顺序">
                <button id="up" type="button" aria-label="动作上移" title="动作上移">↑</button>
                <button id="down" type="button" aria-label="动作下移" title="动作下移">↓</button>
                <button id="remove" type="button">移除</button>
              </div>
            </div>
            <form id="editor">
              <div class="form-fields" id="fields"></div>
              <p id="error" class="error" role="alert"></p>
              <div class="foot">
                <span id="action-status" class="muted" role="status"></span
                ><button class="primary" type="submit">应用动作</button>
              </div>
            </form>
          </section>
          <section class="protocol" aria-label="协议 JSON">
            <div class="heading">
              <h2>协议 JSON</h2>
              <div class="tools" role="group" aria-label="JSON 范围">
                <button type="button" id="action-json" aria-pressed="false" disabled>
                  当前动作
                </button>
                <button type="button" id="rule-json" aria-pressed="true">完整规则</button>
                <button type="button" id="copy">复制规则</button>
              </div>
            </div>
            <p class="muted" id="json-label">已应用规则 · reactions[]</p>
            <pre id="json" aria-label="协议 JSON"></pre>
          </section>
          <section class="sample" aria-label="旅险样例试算">
            <div class="heading">
              <h2>旅险样例试算</h2>
              <button class="primary" id="run" disabled>运行联动</button>
            </div>
            <label
              >当前被保人<select id="member">
                <option value="1">儿童 B · 12 岁</option>
                <option value="0">成人 A · 30 岁</option>
              </select></label
            >
            <div class="results" id="results" hidden aria-live="polite"></div>
          </section>
        </div>
      </div>
    </div>
  </main>
  <dialog id="chooser" class="choice-drawer" aria-labelledby="chooser-title">
    <div class="heading">
      <h2 id="chooser-title">选择要做什么</h2>
      <button id="cancel" type="button">取消</button>
    </div>
    <div id="kinds"></div>
  </dialog>
  <script type="module" src="./reaction-action-playground.js"></script>
</html>
