    </div>

              ? selectFn(any, e.x) + argsUI(e.x)
              : e.mode === 'field'
                ? '<div>来源字段' + fieldButton('payload', '来源字段', e.field) + '</div>'
                : '<label>字段值（JSON）<textarea id="raw">' +
                  escape(e.raw) +
                  '</textarea></label>';
        }
      }
      if (e.type === 'json')
        h =
          '<label>当前规则 JSON<textarea id="raw" class="json">' +
          escape(fmt(rule())) +
          '</textarea></label>';
      s.innerHTML =
        h +
        '<div id="writeWarning" class="sub" role="status"></div><div class="error" role="alert"></div><div class="foot">' +
        btn('cancel', '取消') +
        btn('apply', '应用', 'class="primary"') +
        '</div>';
      refreshWarning();
    }
    function constantValue(text) {
      const value = JSON.parse(text);
      return value !== null && typeof value === 'object' ? { $literal: value } : value;
    }
    function refreshWarning() {
      if (edit?.type !== 'action' || edit.nodeJSON || edit.kind !== 'set') return;
      try {
        const val =
          edit.mode === 'lit'
            ? constantValue($('#raw').value)
            : { $expr: edit.mode === 'fn' ? edit.x : read(edit.field) };
        $('#writeWarning').textContent = setWarning(ref(edit.target), val);
      } catch {
        $('#writeWarning').textContent = '';
      }
    }
    function ensure(ok, msg) {
      if (!ok) throw Error(msg);
    }
    function valid(v, s) {
      if (s === true) return true;
      const t = v === null ? 'null' : Array.isArray(v) ? 'array' : typeof v;
      if (!types(s).some((k) => k === t || (k === 'integer' && Number.isInteger(v)))) return false;
      if (typeof v === 'number' && (v < s.minimum || v > s.maximum)) return false;
      if (s.properties) {
        if (s.required?.some((k) => !Object.hasOwn(v, k))) return false;
        return Object.entries(v).every(([k, val]) =>
          Object.hasOwn(s.properties, k)
            ? valid(val, s.properties[k])
            : s.additionalProperties !== false,
        );
      }
      return true;
    }
    const simpleRef = (r) =>
      r &&
      r.source === 'data' &&
      (!r.scope
        ? Object.keys(r).length === 2 && !r.path?.startsWith('/member:')
        : Object.keys(r).length === 3 && r.scope === memberBinding(rule().scope)?.as) &&
      typeof r.path === 'string' &&
      r.path[0] === '/' &&
      Object.hasOwn(fields, key(r));
    function requireProtocol(kind, value) {
      const check = protocol[kind];
      if (!check(value)) {
        const err = check.errors[0];
        throw Error('协议格式错误 ' + (err.instancePath || '/') + ' · ' + err.message);
      }
    }
    function checkArgument(x, s, param) {
      requireProtocol('expression', x);
      if (x?.op && Object.hasOwn(byId, x.op)) {
        const m = byId[x.op];
        ensure(x.args.length === m.parameters.length, x.op + ' 参数数量不匹配');
        m.parameters.forEach((p, i) => checkArgument(x.args[i], p.schema, p.name));
      }
      if (x?.op || x?.use || x?.ref) {
        const result = outputSchema(x);
        ensure(!result || compatible(result, s), param + ' 表达式返回类型不兼容');
      } else ensure(valid(literalValue(x), s), param + ' 常量与 definition 不符');
    }
    function checkFn(x, s) {
      ensure(compatible(byId[x.op].returns, s), '返回类型与当前位置不匹配');
      byId[x.op].parameters.forEach((p, i) => {
        if (edit.texts[i] !== undefined) {
          let parsed;
          try {
            parsed = JSON.parse(edit.texts[i]);
          } catch {
            throw Error(p.name + ' 需要有效的 JSON');
          }
          x.args[i] = argMode(i, x.args[i]) === 'literal' ? { literal: parsed } : parsed;
        }
        ensure(x.args[i] !== undefined, '请配置 ' + p.name);
        checkArgument(x.args[i], p.schema, p.name);
      });
      return x;
    }
    function visualCondition(x) {
      if (x?.op && Object.hasOwn(byId, x.op))
        return (
          compatible(byId[x.op].returns, bool) && x.args.length === byId[x.op].parameters.length
        );
      return (
        ['core.gt', 'core.eq'].includes(x?.op) &&
        x.args.length === 2 &&
        simpleRef(x.args[0]?.ref) &&
        (x.args[1] === null || typeof x.args[1] !== 'object')
      );
    }
    function visualAction(a) {
      if (a.type === 'host.emit') return simpleRef(a.payload?.$expr?.ref);
      if (a.op !== 'set' || !simpleRef(a.target)) return false;
      const x = a.value?.$expr;
      if (x)
        return (
          simpleRef(x.ref) ||
          (Object.hasOwn(byId, x.op) && x.args.length === byId[x.op].parameters.length)
        );
      return a.value === null || typeof a.value !== 'object' || Object.hasOwn(a.value, '$literal');
    }
    function apply() {
      const e = edit,
        r = rule();
      if (e.nodeJSON) {
        const value = JSON.parse($('#raw').value);
        requireProtocol(e.type === 'action' ? 'action' : 'expression', value);
        if (e.type === 'action') r.then[e.i] = value;
        else if (['core.and', 'core.or'].includes(r.when?.op)) r.when.args[e.i] = value;
        else r.when = value;
        return save();
      }
      if (e.type === 'json') {
        const next = JSON.parse($('#raw').value);
        requireProtocol('reaction', next);
        ensure(!rules.some((a, i) => i !== current && a.rule.id === next.id), '规则 id 已存在');
        rules[current].rule = next;
      }
      if (e.type === 'condition') {
        const x =
          e.mode === 'fn'
            ? checkFn(copy(e.x), bool)
            : call(e.operator, read(e.field), JSON.parse($('#raw').value));
        ensure(visualCondition(x), '比较值需要与字段类型相符');
        const xs = parts().slice();
        xs[e.i < 0 ? xs.length : e.i] = x;
        conditionRows(xs, r.when?.op === 'core.or' ? 'core.or' : 'core.and');
      }
      if (e.type === 'action') {
        let a;
        if (e.kind === 'emit') {
          const event = $('#event').value.trim();
          ensure(event, '请填写事件名称');
          a = { type: 'host.emit', event, payload: { $expr: read(edit.field) } };
        } else {
          const val =
            e.mode === 'fn'
              ? { $expr: checkFn(copy(e.x), any) }
              : e.mode === 'field'
                ? { $expr: read(edit.field) }
                : constantValue($('#raw').value);
          requireProtocol('value', val);
          a = { op: 'set', target: ref(e.target), value: val };
        }
        r.then[e.i < 0 ? r.then.length : e.i] = a;
      }
      save();
    }
    function move(i, j) {
      const a = rule().then;
      if (i < 0 || j < 0 || i >= a.length || j >= a.length) return;
      a.splice(j, 0, a.splice(i, 1)[0]);
      save();
    }
    document.addEventListener('click', (ev) => {
      const b = ev.target.closest('[data-c]');
      if (!b) return;
      const c = b.dataset.c,
        i = Number(b.dataset.i ?? -1),
        r = rule();
      if (c === 'scope') return openScope();
      if (c === 'watch') return openPicker('watch');
      if (['condition', 'action', 'json'].includes(c)) return start(c, i);
      if (c === 'cancel') {
        edit = null;
        return render();
      }
      if (c === 'select') {
        current = i;
        edit = null;
        return render();
      }
      if (c === 'apply') {
        try {
          apply();
        } catch (err) {
          $('.error').textContent = err.message;
        }
        return;
      }
      if (c === 'up' || c === 'down') return move(i, i + (c === 'up' ? -1 : 1));
      if (c === 'observe') r.watch.push(JSON.parse(b.dataset.ref));
      if (c === 'unwatch') r.watch.splice(i, 1);
      if (c === 'delAction') r.then.splice(i, 1);
      if (c === 'delCond') {
        const xs = parts().slice();
        xs.splice(i, 1);
        conditionRows(xs, r.when?.op || 'core.and');
      }
      save();
    });
    document.addEventListener('input', (ev) => {
      const a = ev.target;
      if (a.id === 'search') return renderList();
      if (!edit) return;
      if (a.matches('[data-argtext]')) edit.texts[a.dataset.argtext] = a.value;
      if (a.id === 'raw') {
        edit.raw = a.value;
        refreshWarning();
      }
      if (a.id === 'event') edit.event = a.value;
    });
    document.addEventListener('change', (ev) => {
      const a = ev.target,
        v = a.value,
        e = edit;
      if (a.id === 'activate') {
        rule().runOnActivate = a.checked;
        return save();
      }
      if (a.id === 'mode') {
        conditionRows(parts(), v);
        return save();
      }
      if (!e) return;
      if (a.matches('[data-source]')) {
        const i = Number(a.dataset.source);
        e.sources[i] = v;
        delete e.texts[i];
        e.x.args[i] = undefined;
        if (v === 'expr') e.texts[i] = '';
        drawEditor();
        return;
      }
      if (a.matches('[data-arg]')) {
        const i = Number(a.dataset.arg);
        e.x.args[i] = v ? read(v) : undefined;
        return;
      }
      switch (a.id) {
        case 'fn':
          e.x = newCall(v);
          e.sources = {};
          e.texts = {};
          break;
        case 'condMode':
          e.mode = v;
          e.x = newCall('text.isNonBlank');
          e.sources = {};
          e.texts = {};
          e.field = 'days';
          e.operator = 'core.gt';
          e.raw = '0';
          break;
        case 'field':
          e.field = v;
          if (!compatible(schemas[v], { type: 'number' })) e.operator = 'core.eq';
          break;
        case 'operator':
          e.operator = v;
          break;
        case 'kind':
          Object.assign(
            e,
            actionDraft(v === 'emit' ? { type: 'host.emit', event: 'quote.updated' } : null),
          );
          e.sources = {};
          e.texts = {};
          break;
        case 'target':
        case 'valueMode':
          if (a.id === 'target') e.target = v;
          else e.mode = v;
          break;
        case 'payload':
          e.field = v;
          refreshWarning();
          return;
        default:
          return;
      }
      drawEditor();
    });
    document.addEventListener('dragstart', (ev) => {
      if (ev.target.dataset.drag !== undefined) {
        drag = +ev.target.dataset.drag;
        ev.dataTransfer.setData('text/plain', String(drag));
        ev.dataTransfer.effectAllowed = 'move';
      }
    });
    document.addEventListener('dragover', (ev) => {
      const row = ev.target.closest('[data-row]');
      if (row && drag !== null) {
        ev.preventDefault();
        document.querySelectorAll('.over').forEach((el) => el.classList.remove('over'));
        row.classList.add('over');
      }
    });
    document.addEventListener('drop', (ev) => {
      const row = ev.target.closest('[data-row]');
      if (row && drag !== null) {
        ev.preventDefault();
        move(drag, +row.dataset.row);
      }
      drag = null;
    });
    document.addEventListener('dragend', () => {
      drag = null;
      document.querySelectorAll('.over').forEach((el) => el.classList.remove('over'));
    });
    $('#new').onclick = () => {
      const dlg = $('#newRule');
      dlg.querySelector('form').reset();
      dlg.showModal();
    };
    render();
  </script>
  <dialog id="newRule">
    <form method="dialog">
      <h2>新建联动规则</h2>
      <label>名称 <input required name="title" placeholder="重算预估保费" /></label>
      <div class="foot">
        <button value="cancel" formnovalidate>取消</button
        ><button class="primary" value="create">创建空白规则</button>
      </div>
    </form>
  </dialog>
  <script>
    $('#newRule form').onsubmit = (ev) => {
      if (ev.submitter.value === 'cancel') return;
      const title = ev.target.elements.title.value.trim();
      if (!title) {
        ev.preventDefault();
        return;
      }
      rules.push({
        name: title,
        rule: { id: 'reaction-' + crypto.randomUUID(), watch: [], then: [] },
      });
      current = rules.length - 1;
      $('#search').value = '';
      save();
    };
  </script>
</html>
