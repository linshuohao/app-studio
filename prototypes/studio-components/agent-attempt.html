    <a href="../studio-design-handbook.html">组件总览</a>
    <h1>AttemptHistory · 轮次进度</h1>
    <p>
      接收一个轮次的公开记录 attempt、禁用状态 disabled 和可选的继续处理回调
      resume。会话页和表单侧栏共用。
    </p>
    <p>
      处理中展示原消息和进度，中断后展示已保存内容。服务允许恢复时提供继续处理按钮，完成后可展开处理过程。用
      Tab 移动焦点，Enter 或空格展开详情或激活按钮。
    </p>
    <a href="http://127.0.0.1:3200/?page=agent">在 Agent 工作区打开历史会话</a>
  </main>
