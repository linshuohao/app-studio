<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Studio · 表单详情评审稿</title>
    <link rel="stylesheet" href="../apps/studio/src/app/studio-ui.css" />
    <style>
      html {
        font-size: 13px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        color: var(--studio-text);
        background: var(--studio-surface);
        font: var(--studio-type-body);
      }
      h1,
      h2,
      h3,
      p,
      dl,
      dd {
        margin: 0;
      }
      h1 {
        font: var(--studio-type-title);
      }
      h2,
      h3 {
        font: var(--studio-type-section);
      }
      small,
      .caption,
      dt {
        color: var(--studio-text-muted);
        font: var(--studio-type-caption);
      }
      button {
        cursor: pointer;
      }
      button:focus-visible,
      input:focus-visible,
      a:focus-visible {
        outline: 2px solid var(--studio-focus-ring);
        outline-offset: 2px;
      }
      [hidden] {
        display: none !important;
      }
      .shell {
        min-height: 100dvh;
      }
      .top {
        display: flex;
        min-height: 48px;
        align-items: center;
        gap: var(--studio-space-8);
        padding-inline: var(--studio-space-24);
        border-bottom: 1px solid var(--studio-border);
      }
      .top a {
        color: var(--studio-text-muted);
        text-decoration: none;
      }
      .top a:hover {
        color: var(--studio-text);
      }
      .top .caption {
        margin-inline-start: auto;
      }
      main {
        display: grid;
        gap: var(--studio-space-24);
        padding: var(--studio-space-16) var(--studio-space-24) var(--studio-space-32);
      }
      .page-header,
      .card-heading,
      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: var(--studio-space-8);
      }
      .page-header {
        min-height: 44px;
      }
      .section {
        display: grid;
        gap: var(--studio-space-16);
        min-width: 0;
      }
      .actions,
      .inline {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: var(--studio-space-8);
      }
      [data-studio-part='tab-panel'] {
        padding: 0;
        margin-block-start: var(--studio-space-24);
        min-width: 0;
      }
      [data-studio-part='tabs'] {
        min-width: 0;
      }
      .version-results {
        min-width: 0;
        overflow-x: auto;
      }
      .version-table {
        width: 100%;
        border-collapse: collapse;
        text-align: start;
      }
      .version-table :is(th, td) {
        padding: var(--studio-space-12) var(--studio-space-16);
        border-block-end: 1px solid var(--studio-border);
        text-align: start;
      }
      .version-table thead th {
        background: var(--studio-surface-muted);
        color: var(--studio-text-muted);
        font: var(--studio-type-control);
      }
      .version-table tbody th {
        min-width: 12em;
      }
      .version-table tbody tr:hover {
        background: var(--studio-hover);
      }
      .version-table time {
        white-space: nowrap;
        color: var(--studio-text-muted);
        font-variant-numeric: tabular-nums;
      }
      .version-table :is(th, td):nth-child(2) {
        min-width: 7em;
      }
      .version-table :is(th, td):nth-child(3) {
        min-width: 12em;
      }
      .version-table :is(th, td):last-child {
        width: 1%;
        white-space: nowrap;
      }
      .version-menu {
        position: fixed;
        inset: auto;
        margin: 0;
        min-width: 12em;
        max-width: calc(100vw - var(--studio-space-16));
        max-height: calc(100dvh - var(--studio-space-16));
        overflow: auto;
        padding: var(--studio-space-4);
        border: 1px solid var(--studio-border);
        border-radius: var(--studio-radius-8);
        background: var(--studio-surface);
        box-shadow: var(--studio-overlay-shadow);
      }
      .version-menu [role='menuitem'] {
        display: block;
        width: 100%;
        padding-inline: var(--studio-space-12);
        color: var(--studio-text);
        text-align: start;
        text-decoration: none;
      }
      .version-menu [role='menuitem']:focus-visible {
        background: var(--studio-selected);
        outline-offset: -2px;
      }
      .version-count {
        justify-self: end;
      }
      .status {
        display: inline-block;
        padding: 0 var(--studio-space-8);
        border: 1px solid var(--studio-border);
        border-radius: var(--studio-radius-4);
        background: var(--studio-surface-muted);
        color: var(--studio-text-muted);
        font: var(--studio-type-caption);
      }
      .status[data-status='published'] {
        color: var(--studio-success-fg);
        background: var(--studio-success-bg);
        border-color: var(--studio-success-border);
      }
      .status[data-status='saved'] {
        color: var(--studio-info-fg);
        background: var(--studio-info-bg);
        border-color: var(--studio-info-border);
      }
      .release-layout {
        display: grid;
        grid-template-columns: minmax(200px, 256px) minmax(0, 1fr);
        gap: var(--studio-space-24);
        align-items: start;
      }
      .release-list {
        display: grid;
        gap: var(--studio-space-4);
      }
      .release-list button {
        display: grid;
        gap: var(--studio-space-4);
        text-align: start;
        padding: var(--studio-space-12);
      }
      .release-list button[aria-current='true'] {
        background: var(--studio-selected);
      }
      .release-card {
        display: grid;
        gap: var(--studio-space-16);
        border: 1px solid var(--studio-border);
        border-radius: var(--studio-radius-12);
        padding: var(--studio-space-24);
        min-width: 0;
      }
      .facts {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: var(--studio-space-16);
      }
      .facts > div {
        display: grid;
        gap: var(--studio-space-4);
        overflow-wrap: anywhere;
      }
      .detail-search {
        width: min(320px, 100%);
      }
      .empty {
        padding: var(--studio-space-16) 0;
        color: var(--studio-text-muted);
      }
      dialog {
        width: min(480px, calc(100% - 32px));
        padding: var(--studio-space-24);
        border: 1px solid var(--studio-border);
        border-radius: var(--studio-radius-12);
        color: var(--studio-text);
        box-shadow: var(--studio-overlay-shadow);
      }
      dialog .section {
        gap: var(--studio-space-16);
      }
      dialog .actions {
        justify-content: flex-end;
      }
      pre {
        margin: 0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        max-height: 50dvh;
        overflow: auto;
        font: var(--studio-type-code);
      }
      label.field {
        display: grid;
        gap: var(--studio-space-8);
      }
      @media (max-width: 850px) {
        main,
        .top {
          padding-inline: var(--studio-space-16);
        }
        .release-card {
          padding: var(--studio-space-16);
        }
        .release-layout {
          grid-template-columns: minmax(0, 1fr);
          gap: var(--studio-space-16);
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="top">
        <span>默认空间</span><span aria-hidden="true">/</span>
        <a href="http://localhost:3200/?page=forms">表单</a><span aria-hidden="true">/</span>
        <span aria-current="page">demo</span>
        <small class="caption">本地 demo 数据 · 评审草案</small>
      </header>
      <main>
        <div class="page-header">
          <h1>demo</h1>
          <div class="actions">
            <button class="studio-button" data-variant="secondary" data-dialog="管理表单">
              管理表单
            </button>
            <button class="studio-button" data-variant="secondary" data-dialog="操作记录">
              操作记录
            </button>
            <button class="studio-button" data-variant="primary" data-dialog="新建草稿">
              新建草稿
            </button>
          </div>
        </div>
        <div data-studio-part="tabs" data-size="md">
          <div role="tablist" data-studio-part="tab-list" aria-label="表单详情视图">
            <button
              id="versions-tab"
              role="tab"
              data-studio-part="tab"
              aria-controls="versions"
              aria-selected="true"
            >
              版本列表
            </button>
            <button
              id="releases-tab"
              role="tab"
              data-studio-part="tab"
              aria-controls="releases"
              aria-selected="false"
              tabindex="-1"
            >
              发布记录
            </button>
          </div>
          <section
            id="versions"
            role="tabpanel"
            aria-labelledby="versions-tab"
            data-studio-part="tab-panel"
            tabindex="0"
            class="section"
          >
            <div class="toolbar">
              <div class="studio-list-filters" aria-label="版本筛选">
                <input
                  class="studio-input detail-search"
                  type="search"
                  id="version-search"
                  aria-label="搜索版本"
                  placeholder="搜索版本名称…"
                />
                <button id="clear-search" class="studio-button" data-variant="text" hidden>
                  清除搜索
                </button>
              </div>
            </div>
            <div
              class="studio-table-results version-results"
              role="region"
              aria-label="版本结果"
              tabindex="0"
            >
              <table class="version-table" aria-label="工作版本">
                <thead>
                  <tr>
                    <th scope="col">版本名称</th>
                    <th scope="col">状态</th>
                    <th scope="col">更新时间</th>
                    <th scope="col">操作</th>
                  </tr>
                </thead>
                <tbody id="version-rows"></tbody>
              </table>
            </div>
            <output class="caption version-count" id="count" aria-live="polite"></output>
            <p class="empty" id="empty" hidden>没有匹配的版本。可以清除搜索后查看全部版本。</p>
          </section>
          <section
            id="releases"
            role="tabpanel"
            aria-labelledby="releases-tab"
            data-studio-part="tab-panel"
            tabindex="0"
            hidden
          >
            <div class="release-layout">
              <nav class="release-list" aria-label="选择发布版本" id="release-list"></nav>
              <article class="release-card">
                <div class="card-heading">
                  <h2 id="release-name"></h2>
                  <button class="studio-button" data-variant="text" data-dialog="查看发布完整标识">
                    查看发布完整标识
                  </button>
                </div>
                <div class="inline">
                  <span class="caption">配置版本</span
                  ><button
                    class="studio-button"
                    data-variant="secondary"
                    data-dialog="查看配置"
                    id="release-version"
                  ></button>
                </div>
                <div data-studio-part="tabs" data-size="sm">
                  <div role="tablist" data-studio-part="tab-list" aria-label="发布详情视图">
                    <button
                      id="info-tab"
                      role="tab"
                      data-studio-part="tab"
                      aria-controls="info"
                      aria-selected="true"
                    >
                      发布信息
                    </button>
                    <button
                      id="host-tab"
                      role="tab"
                      data-studio-part="tab"
                      aria-controls="host"
                      aria-selected="false"
                      tabindex="-1"
                    >
                      Host 接入
                    </button>
                  </div>
                  <section
                    id="info"
                    role="tabpanel"
                    aria-labelledby="info-tab"
                    data-studio-part="tab-panel"
                    tabindex="0"
                    class="section"
                  >
                    <dl class="facts">
                      <div>
                        <dt>目标平台</dt>
                        <dd id="release-target"></dd>
                      </div>
                      <div>
                        <dt>发布时间</dt>
                        <dd id="release-time"></dd>
                      </div>
                      <div>
                        <dt>发布人</dt>
                        <dd id="release-actor"></dd>
                      </div>
                    </dl>
                    <details id="release-diagnostics" hidden>
                      <summary>发布诊断</summary>
                      <ul id="diagnostic-items"></ul>
                    </details>
                    <div>
                      <button
                        class="studio-button"
                        data-variant="secondary"
                        data-dialog="在示例 Host 中打开"
                      >
                        在示例 Host 中打开
                      </button>
                    </div>
                  </section>
                  <section
                    id="host"
                    role="tabpanel"
                    aria-labelledby="host-tab"
                    data-studio-part="tab-panel"
                    tabindex="0"
                    class="section"
                    hidden
                  >
                    <h3>所需宿主能力</h3>
                    <p id="host-target">Web · desktop</p>
                    <dl class="facts">
                      <div>
                        <dt>请求</dt>
                        <dd><code>travel.searchCities</code></dd>
                      </div>
                      <div>
                        <dt>提交动作</dt>
                        <dd><code>travel.submit</code></dd>
                      </div>
                    </dl>
                  </section>
                </div>
              </article>
            </div>
          </section>
        </div>
      </main>
    </div>
    <div class="version-menu" id="version-menu" popover="auto" role="menu"></div>
    <dialog id="preview" aria-labelledby="dialog-title">
      <form method="dialog" class="section">
        <h2 id="dialog-title"></h2>
        <div id="dialog-body" class="section"></div>
        <div class="actions" id="dialog-actions"></div>
      </form>
    </dialog>

    <script>
      for (const list of document.querySelectorAll('[role="tablist"]')) {
        const tabs = [...list.querySelectorAll('[role="tab"]')];
        const select = (tab) => {
          for (const item of tabs) {
            const active = item === tab;
            item.setAttribute('aria-selected', String(active));
            item.tabIndex = active ? 0 : -1;
            document.getElementById(item.getAttribute('aria-controls')).hidden = !active;
          }
        };
        tabs.forEach((tab) => tab.addEventListener('click', () => select(tab)));
        list.addEventListener('keydown', (event) => {
          const index = tabs.indexOf(event.target);
          if (index < 0) return;
          const target = {
            ArrowLeft: (index + tabs.length - 1) % tabs.length,
            ArrowRight: (index + 1) % tabs.length,
            Home: 0,
            End: tabs.length - 1,
          }[event.key];
          if (target === undefined) return;
          event.preventDefault();
          select(tabs[target]);
          tabs[target].focus();
        });
      }

      const search = document.getElementById('version-search');
      const clear = document.getElementById('clear-search');

      function filter() {
        const rows = [...document.querySelectorAll('#version-rows tr')];
        const query = search.value.trim();
        rows.forEach((row) => {
          row.hidden = !row.dataset.name.includes(query);
        });
        const visible = rows.filter((row) => !row.hidden).length;
        document.getElementById('count').textContent = '共 ' + visible + ' 个版本';
        document.getElementById('empty').hidden = visible !== 0;
        clear.hidden = !search.value;
      }
      search.addEventListener('input', filter);
      clear.addEventListener('click', () => {
        search.value = '';
        filter();
        search.focus();
      });

      const data = JSON.parse(document.getElementById('demo-data').textContent);
      data.form.archived = data.form.archived === true || Number(data.form.archived) === 1;
      const byId = (id) => document.getElementById(id);
      const escape = (text) =>
        String(text ?? '').replace(
          /[&<>"']/g,
          (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char],
        );
      const time = (stamp) =>
        stamp
          ? new Intl.DateTimeFormat('sv-SE', {
              dateStyle: 'short',
              timeStyle: 'short',
              timeZone: 'Asia/Shanghai',
            }).format(new Date(stamp))
          : '未记录';
      const button = (label, action, value = '', variant = 'secondary', menuItem = false) =>
        '<button type="button" ' +
        (menuItem ? 'role="menuitem" tabindex="-1" ' : '') +
        'class="studio-button" data-variant="' +
        variant +
        '" data-action="' +
        action +
        '" data-value="' +
        escape(value) +
        '">' +
        escape(label) +
        '</button>';
      const assetUrl = (params) =>
        'http://localhost:3200/?' + new URLSearchParams({ form: data.form.id, ...params });
      const snapshot = (id) => data.versions.find((version) => version.id === id);
      const titleOf = (release) => release.name || '发布 · ' + time(release.recorded);
      const liveRelease = (id) => !id.startsWith('preview-');
      const open = (url) => window.open(url, '_blank', 'noopener,noreferrer');
      let selectedRelease = data.releases[0]?.id;
      let lastPublished;
      const query = new URLSearchParams(location.search);
      const role = query.get('role');
      const canManage = !role || role === 'admin';
      const canPublish = canManage || role === 'publisher';
      const editable = () => (canManage || role === 'editor') && !data.form.archived;
      const dialog = byId('preview');
      const editConfig = (row) => row.config ?? snapshot(row.head)?.config ?? '{}';
      const hostUrl = (id) =>
        'http://localhost:3200/host?' + new URLSearchParams({ releaseId: id });

      function renderVersions() {
        document.querySelector('[data-dialog="管理表单"]').hidden = !editable() && !canManage;
        document.querySelector('[data-dialog="操作记录"]').hidden = !canManage;
        document.querySelector('[data-dialog="新建草稿"]').hidden = !editable();
        byId('version-rows').innerHTML = data.works
          .map((row) => {
            const status = row.published ? '已发布' : row.head ? '未发布' : '草稿';
            return (
              '<tr data-name="' +
              escape(row.name) +
              '"><th scope="row">' +
              escape(row.name) +
              '</th><td><span class="status" data-status="' +
              (row.published ? 'published' : row.head ? 'saved' : '') +
              '">' +
              status +
              '</span></td><td><time datetime="' +
              escape(row.updated) +
              '">' +
              time(row.updated) +
              '</time></td><td><button type="button" class="studio-button" data-variant="secondary"' +
              ' aria-haspopup="menu" aria-expanded="false" aria-controls="version-menu"' +
              ' aria-label="' +
              escape(row.name) +
              '的操作" data-action="version-menu" data-value="' +
              escape(row.id) +
              '">操作</button></td></tr>'
            );
          })
          .join('');
        filter();
      }

      const menu = byId('version-menu');
      let menuTrigger;
      function closeVersionMenu(restoreFocus = false) {
        if (!menuTrigger) return;
        const trigger = menuTrigger;
        menuTrigger = undefined;
        trigger.setAttribute('aria-expanded', 'false');
        if (menu.matches(':popover-open')) menu.hidePopover();
        if (restoreFocus) trigger.focus();
      }

      function showVersionMenu(row, trigger, focusLast = false) {
        const item = (label, action, value = row.id) => button(label, action, value, 'text', true);
        menu.innerHTML =
          item(editable() && !row.published ? '编辑配置' : '查看配置', 'work') +
          (lastPublished?.work === row.id
            ? item('查看本次发布', 'release', lastPublished.id)
            : '') +
          (row.head ? item('保存历史', 'history') : '') +
          (editable() ? item('基于此版创建新版', 'new') : '') +
          (row.head && !row.published && !data.form.archived && canPublish
            ? item('发布', 'publish')
            : '');
        if (menuTrigger && menuTrigger !== trigger) closeVersionMenu();
        if (!menu.matches(':popover-open')) menu.showPopover();
        menuTrigger = trigger;
        trigger.setAttribute('aria-expanded', 'true');
        menu.setAttribute('aria-label', row.name + '的操作');
        const { right, top, bottom } = trigger.getBoundingClientRect();
        const gap = 4;
        menu.style.left = Math.max(gap, right - menu.offsetWidth) + 'px';
        menu.style.top =
          (bottom + gap + menu.offsetHeight <= window.innerHeight
            ? bottom + gap
            : Math.max(gap, top - gap - menu.offsetHeight)) + 'px';
        (focusLast ? menu.lastElementChild : menu.firstElementChild).focus();
      }

      menu.addEventListener('toggle', () => {
        if (!menu.matches(':popover-open')) closeVersionMenu();
      });
      menu.addEventListener('keydown', (event) => {
        const items = [...menu.querySelectorAll('[role="menuitem"]')];
        const index = items.indexOf(document.activeElement);
        const last = items.length - 1;
        const target = {
          ArrowUp: index <= 0 ? last : index - 1,
          ArrowDown: index === last ? 0 : index + 1,
          Home: 0,
          End: last,
        }[event.key];
        if (target !== undefined) {
          event.preventDefault();
          items[target].focus();
        } else if (event.key === 'Escape' || event.key === 'Tab') {
          if (event.key === 'Escape') event.preventDefault();
          closeVersionMenu(true);
        }
      });
      byId('version-rows').addEventListener('keydown', (event) => {
        const trigger = event.target.closest('[data-action="version-menu"]');
        if (!trigger || !['ArrowDown', 'ArrowUp'].includes(event.key)) return;
        event.preventDefault();
        showVersionMenu(
          data.works.find((row) => row.id === trigger.dataset.value),
          trigger,
          event.key === 'ArrowUp',
        );
      });

      function showRelease(id) {
        selectedRelease = id;
        byId('release-list').innerHTML = data.releases
          .map(
            (item) =>
              '<button class="studio-button" data-variant="text" data-action="release" data-value="' +
              escape(item.id) +
              '" aria-current="' +
              (item.id === id) +
              '"><strong>' +
              escape(titleOf(item)) +
              '</strong><small>' +
              time(item.recorded) +
              '</small></button>',
          )
          .join('');
        const release = data.releases.find((item) => item.id === id);
        if (!release) return;
        byId('release-name').textContent = titleOf(release);
        byId('release-version').textContent = snapshot(release.version)?.name || '保存快照';
        byId('release-time').textContent = time(release.recorded);
        byId('release-actor').textContent = release.actor || '未记录';
        const target =
          typeof release.target === 'string' ? JSON.parse(release.target) : release.target;
        byId('release-target').textContent = target.platform + ' / ' + target.profile;
        byId('host-target').textContent = target.platform + ' / ' + target.profile;
        const findings =
          typeof release.diagnostics === 'string'
            ? JSON.parse(release.diagnostics)
            : release.diagnostics;
        byId('release-diagnostics').hidden = !findings?.length;
        byId('diagnostic-items').innerHTML = (findings || [])
          .map((finding) => '<li>' + escape(finding.message) + '</li>')
          .join('');
        byId('info-tab').click();
      }

      function showDialog(title, content, actions = '', submit) {
        byId('dialog-title').textContent = title;
        byId('dialog-body').innerHTML = content;
        byId('dialog-actions').innerHTML = button('关闭', 'close') + actions;
        dialog.querySelector('form').onsubmit = (event) => {
          event.preventDefault();
          submit?.(Object.fromEntries(new FormData(event.currentTarget)));
        };
        if (!dialog.open) dialog.showModal();
        (
          byId('dialog-body').querySelector('input,select,button') ||
          byId('dialog-actions').firstElementChild
        ).focus();
      }
      const input = (label, value = '', name = 'name', required = true) =>
        '<label class="field">' +
        label +
        '<input class="studio-input" name="' +
        name +
        '" value="' +
        escape(value) +
        '" maxlength="80" ' +
        (required ? 'required' : '') +
        '></label>';
      const submit = (label) =>
        '<button class="studio-button" type="submit" data-variant="primary">' + label + '</button>';
      const localNotice = '<p class="caption">以下操作仅更新本 HTML 草案。</p>';

      function newWork(row) {
        showDialog(
          '创建草稿版本',
          input('版本名称', row ? row.name + ' · 新版' : '') + localNotice,
          submit('创建并编辑'),
          ({ name }) => {
            const work = {
              id: 'preview-' + Date.now(),
              name: name.trim(),
              updated: new Date().toISOString(),
              head: null,
              published: false,
              config: row ? editConfig(row) : '{}',
            };
            if (!work.name) return;
            data.works.unshift(work);
            search.value = '';
            renderVersions();
            editPreview(work);
          },
        );
      }
      function editPreview(row) {
        showDialog(
          '配置工作台 · ' + row.name,
          localNotice +
            '<label class="field">配置原文<textarea class="studio-input" name="config" rows="8">' +
            escape(editConfig(row)) +
            '</textarea></label>',
          submit('保存配置'),
          ({ config }) => {
            const version = {
              id: 'preview-' + Date.now(),
              work: row.id,
              name: row.name,
              saved: new Date().toISOString(),
              config,
            };
            data.versions.unshift(version);
            row.head = version.id;
            row.updated = version.saved;
            renderVersions();
            dialog.close();
          },
        );
      }

      function publish(row, values = {}) {
        let views = [];
        try {
          views = Object.keys(JSON.parse(editConfig(row)).views || {});
        } catch {}
        const choice = values.profile ?? (views.length === 1 ? views[0] : '');
        const profiles =
          '<label class="field">Web 视图<select class="studio-input" id="publish-profile" name="profile" required>' +
          '<option value="">选择视图</option>' +
          views
            .map(
              (value) =>
                '<option ' +
                (value === choice ? 'selected ' : '') +
                'value="' +
                escape(value) +
                '">' +
                escape(value) +
                '</option>',
            )
            .join('') +
          '</select></label>';
        showDialog(
          '发布版本',
          '<p>发布「' +
            escape(row.name) +
            '」当前保存的配置，成功后此版本只读。</p>' +
            input('发布名称', values.name ?? row.name) +
            profiles +
            localNotice,
          button('与上次发布对比', 'compare-release', row.id) + submit('确认发布'),
          ({ name, profile }) => {
            if (!name.trim() || !profile) return;
            const release = {
              id: 'preview-' + Date.now(),
              name: name.trim(),
              version: row.head,
              actor: '草案演示',
              recorded: new Date().toISOString(),
              target: { platform: 'web', profile },
              diagnostics: [],
            };
            data.releases.unshift(release);
            row.published = true;
            lastPublished = { work: row.id, id: release.id };
            renderVersions();
            showRelease(release.id);
            dialog.close();
          },
        );
        const select = byId('publish-profile');
        const confirm = byId('dialog-actions').querySelector('[type="submit"]');
        const sync = () => {
          confirm.disabled = !select.value;
        };
        sync();
        select.onchange = sync;
      }

      function history(row) {
        const saved = data.versions.filter((version) => version.work === row.id);
        const entries = saved
          .map(
            (item, index) =>
              '<div class="inline"><strong>第 ' +
              (saved.length - index) +
              ' 次保存</strong><small>' +
              time(item.saved) +
              ' · ' +
              escape(item.note || item.name || '无备注') +
              '</small>' +
              button('查看快照', 'snapshot', item.id) +
              '</div>',
          )
          .join('');
        showDialog(
          '保存历史',
          '<h3>' + escape(row.name) + '</h3>' + entries,
          saved.length > 1 ? button('对比快照', 'compare-history', row.id) : '',
        );
      }

      function compare(row, releaseCompare) {
        const candidates = data.versions.filter((version) => version.work === row.id);
        const left = releaseCompare ? snapshot(data.releases[0]?.version) : candidates[1];
        const right = candidates[0];
        const previous = releaseCompare
          ? Object.fromEntries(new FormData(dialog.querySelector('form')))
          : {};
        const pane = (item) =>
          item
            ? '<small>' + time(item.saved) + '</small><pre>' + escape(item.config) + '</pre>'
            : '<p>暂无可比较的配置。</p>';
        showDialog(
          releaseCompare ? '与上次发布对比' : '对比快照',
          '<div class="facts"><div><strong>' +
            (releaseCompare ? '上次发布' : '较早快照') +
            '</strong>' +
            pane(left) +
            '</div><div><strong>当前保存配置</strong>' +
            pane(right) +
            '</div></div>',
          button(releaseCompare ? '返回发布' : '返回保存历史', 'return-compare', row.id),
        );
        byId('dialog-actions').querySelector('[data-action="return-compare"]').onclick = () => {
          if (releaseCompare) publish(row, previous);
          else history(row);
        };
      }

      function manage() {
        const actions =
          (editable() ? button('编辑名称与说明', 'metadata') : '') +
          (canManage ? button(data.form.archived ? '恢复表单' : '归档表单', 'archive') : '') +
          (editable() && data.versions.length ? button('复制为新表单', 'copy-form') : '');
        showDialog(
          '管理表单',
          '<strong>' +
            escape(data.form.name) +
            '</strong><p>' +
            (data.form.archived ? '已归档' : '使用中') +
            '</p>' +
            localNotice,
          actions,
        );
      }
      function operations() {
        const labels = {
          create: '创建表单',
          publish: '发布',
          archive: '归档',
          restore: '恢复',
          metadata: '编辑表单信息',
        };
        const entries = [
          { action: 'create', recorded: data.form.created },
          ...data.operations,
          ...data.releases.map((release) => ({
            action: 'publish',
            recorded: release.recorded,
            release,
          })),
        ].sort((a, b) => String(b.recorded).localeCompare(String(a.recorded)));
        showDialog(
          '表单操作记录',
          '<div class="inline"><label>开始日期 <input id="records-from" type="date" class="studio-input"></label>' +
            '<label>结束日期 <input id="records-to" type="date" class="studio-input"></label>' +
            '<label>动作 <select id="records-action" class="studio-input"><option value="">全部</option>' +
            [...new Set(entries.map((entry) => entry.action))]
              .map(
                (action) =>
                  '<option value="' +
                  escape(action) +
                  '">' +
                  escape(labels[action] || action) +
                  '</option>',
              )
              .join('') +
            '</select></label>' +
            '<label>结果 <select id="records-result" class="studio-input"><option value="">全部</option><option value="success">成功</option><option value="failure">失败</option></select></label></div>' +
            '<div id="record-items" class="section"></div>',
        );
        const update = () => {
          byId('record-items').innerHTML =
            entries
              .filter(
                (entry) =>
                  (!byId('records-action').value ||
                    entry.action === byId('records-action').value) &&
                  (!byId('records-from').value ||
                    time(entry.recorded).slice(0, 10) >= byId('records-from').value) &&
                  (!byId('records-to').value ||
                    time(entry.recorded).slice(0, 10) <= byId('records-to').value) &&
                  byId('records-result').value !== 'failure',
              )
              .map(
                (entry) =>
                  '<div class="inline"><small>' +
                  time(entry.recorded) +
                  '</small><strong>' +
                  escape(labels[entry.action] || entry.action) +
                  '</strong><span class="status">成功</span>' +
                  (entry.release ? button('查看发布', 'release', entry.release.id) : '') +
                  '</div>',
              )
              .join('') || '<p>暂无匹配记录。</p>';
        };
        byId('dialog-body').onchange = (event) => {
          if (event.target.id.startsWith('records-')) update();
        };
        update();
      }

      document.addEventListener('click', (event) => {
        const control = event.target.closest('[data-action], [data-dialog]');
        if (!control) return;
        if (menu.contains(control)) closeVersionMenu(true);
        const { action, value } = control.dataset;
        const row = data.works.find((item) => item.id === value);
        const release = data.releases.find((item) => item.id === selectedRelease);
        if (control.dataset.dialog === '管理表单') return manage();
        if (control.dataset.dialog === '操作记录') return operations();
        if (control.dataset.dialog === '新建草稿') return newWork();
        if (control.dataset.dialog === '查看发布完整标识')
          return showDialog(
            '发布标识',
            '<code>' + escape(release.id) + '</code>',
            button('复制标识', 'copy-id', release.id),
          );
        if (control.dataset.dialog === '在示例 Host 中打开')
          return liveRelease(release.id)
            ? open(hostUrl(release.id))
            : showDialog('示例 Host', localNotice);
        if (control.id === 'release-version')
          return liveRelease(release.id)
            ? open(assetUrl({ tab: 'history', version: release.version }))
            : showDialog(
                '保存快照',
                '<pre>' + escape(snapshot(release.version)?.config) + '</pre>',
              );
        switch (action) {
          case 'close':
            dialog.close();
            break;
          case 'version-menu':
            if (menuTrigger === control && menu.matches(':popover-open')) closeVersionMenu(true);
            else showVersionMenu(row, control);
            break;
          case 'work':
            if (liveRelease(row.id)) open(assetUrl({ work: row.id }));
            else editPreview(row);
            break;
          case 'snapshot':
            if (liveRelease(value)) open(assetUrl({ tab: 'history', version: value }));
            else showDialog('保存快照', '<pre>' + escape(snapshot(value)?.config) + '</pre>');
            break;
          case 'new':
            newWork(row);
            break;
          case 'history':
            history(row);
            break;
          case 'publish':
            publish(row);
            break;
          case 'compare-release':
            compare(row, true);
            break;
          case 'compare-history':
            compare(row, false);
            break;
          case 'release':
            if (dialog.open) dialog.close();
            byId('releases-tab').click();
            showRelease(value);
            byId('release-list').querySelector('[aria-current="true"]').focus();
            break;
          case 'copy-id':
            navigator.clipboard.writeText(value).then(
              () => {
                control.textContent = '已复制';
              },
              () => {
                control.textContent = '请手动复制';
              },
            );
            break;
          case 'metadata':
            showDialog(
              '编辑名称与说明',
              input('表单名称', data.form.name) +
                input('表单说明', data.form.description, 'description', false) +
                localNotice,
              submit('保存表单信息'),
              ({ name, description }) => {
                if (!name.trim()) return;
                Object.assign(data.form, { name: name.trim(), description });
                document.querySelector('h1').textContent = data.form.name;
                document.querySelector('.top [aria-current]').textContent = data.form.name;
                manage();
              },
            );
            break;
          case 'archive':
            showDialog(
              data.form.archived ? '恢复表单' : '归档表单',
              '<p>' +
                (data.form.archived
                  ? '恢复后可按权限继续编辑和发布。'
                  : '归档将停止编辑和新发布，已有发布仍可装载。') +
                '</p>' +
                localNotice,
              submit('确认'),
              () => {
                data.form.archived = !data.form.archived;
                renderVersions();
                manage();
              },
            );
            break;
          case 'copy-form':
            showDialog(
              '复制为新表单',
              input('新表单名称', data.form.name + ' · 副本') + localNotice,
              submit('确认复制'),
              ({ name }) =>
                showDialog('复制为新表单', '<p>草案中的复制结果为「' + escape(name) + '」。</p>'),
            );
            break;
        }
      });
      renderVersions();
      showRelease(selectedRelease);
    </script>
  </body>
</html>
