[project]
name = "form-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "deepagents>=0.5.4,<0.6",
  "fastapi>=0.115,<1",
  "langchain>=1.5,<2",
  "langchain-core>=1.8,<2",
  "langgraph>=1.2,<2",
  "langsmith>=0.16,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2,<3",
  "sqlalchemy[asyncio]>=2,<3",
  "httpx>=0.28,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
openai = [
    "langchain-openai>=1.8.5",
]

[dependency-groups]
dev = [
    "pyright>=1.1,<2",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
